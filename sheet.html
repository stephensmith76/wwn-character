      // HIGH MAGIC — Level 1
      {tradition:'High Magic',lvl:1,name:'Apprehending the Arcane Form',desc:'For 15 minutes per caster level, you see magic auras and enchantments clearly and can see in complete darkness as well as in ordinary daylight. Reveals the general nature of enchantments but not their specific details.'},
      {tradition:'High Magic',lvl:1,name:'Cognitive Supersession of the Inferior Orders',desc:'Form a telepathic bond with one animal within sight; it can communicate simple concepts and will obey commands for one scene. The animal will not fight or take suicidal risks on your behalf.'},
      {tradition:'High Magic',lvl:1,name:'The Coruscating Coffin',desc:'A visible target takes 1d8 damage per caster level; a Physical save halves the damage. Creatures of 1 HD or less die outright on a failed save without requiring a damage roll.'},
      {tradition:'High Magic',lvl:1,name:'Damnation of the Sense',desc:'On a failed Mental save, you control one of the target\'s five senses for the rest of the scene. You determine what they perceive through that sense; the target knows they\'re being deceived but cannot act against the false perception.'},
      {tradition:'High Magic',lvl:1,name:'Decree of Ligneous Dissolution',desc:'All non-magical plant-derived matter (wood, rope, cloth, leather, paper) within the target area disintegrates instantly. Area extends up to 10 feet per caster level in radius.'},
      {tradition:'High Magic',lvl:1,name:'The Excellent Transpicuous Transformation',desc:'One target per caster level within sight becomes invisible for 1 hour per caster level. The invisibility ends if the target attacks or casts a spell. Carried items become invisible along with the target.'},
      {tradition:'High Magic',lvl:1,name:'Imperceptible Cerebral Divulgence',desc:'You scan a target\'s surface thoughts and they truthfully answer one question per caster level without realizing they\'ve spoken. You learn what they consciously know about the topic; unconscious knowledge is inaccessible.'},
      {tradition:'High Magic',lvl:1,name:'Ineluctable Shackles of Volition',desc:'A target within sight who fails a Mental save becomes mentally enslaved, obeying all commands. They appear visibly dazed and zombie-like to observers. The effect persists until dispelled or you release them.'},
      {tradition:'High Magic',lvl:1,name:'The Long Amber Moment',desc:'A willing creature you touch enters invulnerable stasis; time stops for them and they cannot be harmed. The stasis ends when the caster wills it, or when a condition set at casting is met.'},
      {tradition:'High Magic',lvl:1,name:'Phantasmal Mimesis',desc:'Create a fully interactive illusion within a target area; illusory fire burns, illusory objects can be picked up, and the illusion is self-sustaining. Lasts until dispelled or the scene ends. Disbelievers may make a Mental save to see through it.'},

      {tradition:'High Magic',lvl:1,name:'Wardpact Invocation',desc:'Either grant one target partial immunity to weapons made of one chosen material type for the rest of the scene, or make one weapon completely inert and unable to deal damage for a scene.'},
      {tradition:'High Magic',lvl:1,name:'The Wind of the Final Repose',desc:'Living targets of 4 HD or less within the area must make a Physical save or fall into deep sleep lasting until dawn or until disturbed. Higher HD creatures are entirely unaffected.'},
      // HIGH MAGIC — Level 2
      {tradition:'High Magic',lvl:2,name:'Calculation of the Evoked Servitor',desc:'Summon an obedient magical familiar of any appearance up to cat size. It obeys all commands except fighting and can manipulate small objects. The familiar persists until dismissed or destroyed.'},
      {tradition:'High Magic',lvl:2,name:'Casting Forth the Inner Eye',desc:'Scry a distant location you\'ve visited or know through a luminous or reflective surface for as long as you concentrate. You see and hear as if present but cannot affect anything there.'},
      {tradition:'High Magic',lvl:2,name:'Conjunction of the Inexorable Step',desc:'Instantly teleport a creature or loose object within sight to any visible non-dangerous location within 100 feet per caster level. Unwilling targets may resist with a Physical save.'},
      {tradition:'High Magic',lvl:2,name:'Decree of Lithic Dissolution',desc:'Destroy all non-magical stone, earth, or non-metal minerals within the target area up to 10 feet per caster level in radius. Magical stone and worked metal are immune.'},
      {tradition:'High Magic',lvl:2,name:'Extirpate Arcana',desc:'Dispel all active magical effects within a 20-foot radius of the target point. Functions as a targeted dispel against magical objects (contested roll vs. caster level). Cannot dispel permanent enchantments.'},
      {tradition:'High Magic',lvl:2,name:'The Inexorable Imputation',desc:'You make a statement that all listeners believe to be true, as long as it is not physically impossible or directly contrary to their deepest beliefs. The belief persists until the listener has strong reason to doubt it.'},
      {tradition:'High Magic',lvl:2,name:'Jade Palanquin of the Faceless God',desc:'Summon an ornate floating palanquin that can carry up to a ton of weight, moves at 20 feet per round, and follows simple commands. The palanquin persists until the next dawn.'},
      {tradition:'High Magic',lvl:2,name:'Mantle of Disjecting Dissection',desc:'A willing target is wreathed in invisible blades; any creature that hits them in melee takes 1d6 damage per two caster levels. The mantle lasts for the rest of the scene.'},
      {tradition:'High Magic',lvl:2,name:'Prudentially Transient Abnegation of Life',desc:'A willing target at zero hit points appears to die by all mundane examination. They revive fully healthy after a scene or at the caster\'s signal, with no lasting ill effects.'},
      {tradition:'High Magic',lvl:2,name:'Resounding Temporal Echo',desc:'One or more targets immediately gain an extra Main Action for the remainder of this round. Each additional action costs 1 System Strain to the target receiving it.'},

      {tradition:'High Magic',lvl:2,name:'Visitation of the Clement Clime',desc:'You and up to three allies per caster level become immune to all natural heat or cold (not fire or cold damage from spells) for 24 hours. Does not protect against supernatural extremes of temperature.'},

      {tradition:'High Magic',lvl:3,name:'Conjunct the Vital Viscera',desc:'Mystically merge two living creatures so they share a pool of hit points equal to both totals. Injuries to either reduce the shared pool; both die if it hits zero. The merge lasts until dispelled or dawn.'},
      {tradition:'High Magic',lvl:3,name:'Exhalation of Congelating Cold',desc:'Freeze a target area in killing cold, dealing 1d6 damage per two caster levels. A Physical save halves the damage. Affected terrain becomes slick and difficult to traverse for the rest of the scene.'},
      {tradition:'High Magic',lvl:3,name:'Foresightful Apprehension',desc:'Ask one question about the most likely outcome of an action that will occur in the next five minutes. The answer is accurate to the best available information; unlikely but possible outcomes may not be revealed.'},
      {tradition:'High Magic',lvl:3,name:'Glass Chimes of the Bamboo Terrace',desc:'Summon ethereal chimes that can carry a spoken message to any known location, or deal 3d6 damage to all targets in a 20-foot radius. Used as a weapon, the chimes require a ranged attack roll.'},
      {tradition:'High Magic',lvl:3,name:'The Howl of Light',desc:'An explosion of blinding radiance deals 1d8 damage per caster level to everything within a 30-foot radius of the target point. A Physical save halves the damage. The blast can be seen for miles.'},
      {tradition:'High Magic',lvl:3,name:'Phobic Storm',desc:'Unleash terror in a 40-foot radius; affected foes must make a Mental save or be seized with crippling fear, forcing immediate Morale checks and dealing 1d6 damage per round they remain within the area.'},
      {tradition:'High Magic',lvl:3,name:'Scorn the Fetters of Earth',desc:'You and one ally per caster level can move through the air at your normal movement rate for the rest of the scene. If the effect ends while aloft, targets fall normally.'},
      {tradition:'High Magic',lvl:3,name:'The Torment of Tumefaction',desc:'Curse a target with grotesque swellings that cause 1d6 damage whenever they take any significant physical action (attacking, running, casting). A Physical save negates the damage each time. Lasts until dispelled.'},
      {tradition:'High Magic',lvl:3,name:'Touch of Elucidating Intangibility',desc:'Touch any barrier up to 3 feet thick to see through it clearly, or make a section up to 10 feet across temporarily intangible for one round, allowing easy passage. Cannot affect magical barriers.'},
      {tradition:'High Magic',lvl:3,name:'Vallation of Specified Exclusion',desc:'Create a barrier up to 20 feet per level long that prevents targets of a specific describable category from crossing. The barrier is invisible but absolutely impassable to the specified type. Lasts one scene.'},

      {tradition:'High Magic',lvl:4,name:'Calculation of the Phantasmal Eidolon',desc:'Summon an obedient magical construct that can fight: 4 HD, AC 14, deals 1d8 damage per hit. It follows complex instructions and lasts until destroyed or the scene ends.'},
      {tradition:'High Magic',lvl:4,name:'Contingent Excision of Arcana',desc:'Cast this spell to store a dispel magic effect that can be triggered as an Instant action once at any time before the next dawn. The stored dispel affects one magical effect of your choice when triggered.'},
      {tradition:'High Magic',lvl:4,name:'Disjunctive Temporal Reversion',desc:'Allow one target to act again this round as if their previous actions this round hadn\'t happened; they can make entirely different choices. Can be cast as an Instant action to save an ally mid-round.'},
      {tradition:'High Magic',lvl:4,name:'Evert the Inwardness',desc:'Either pull all contents from a container instantly, or rip the viscera from a living creature within sight (Physical save or take 3d6 damage and be incapacitated for the rest of the scene).'},

      {tradition:'High Magic',lvl:4,name:'Obnubilation of the Will',desc:'A helpless target (bound, unconscious, etc.) becomes completely enslaved to the caster\'s will with full intelligence intact. They will do anything commanded. Cannot be cast on a merely unresisting target.'},
      {tradition:'High Magic',lvl:4,name:'Ochre Sigil of Juxtaposition',desc:'Mark a location with a sigil; you can instantly swap yourself or another target between the marked location and any other prepared distant location. The swap is instantaneous and ignores all intervening obstacles.'},

      {tradition:'High Magic',lvl:4,name:'Sigil of Aeolian Auctoritas',desc:'Create a directed blast of hurricane-force wind in a cone, hurling creatures back and dealing 2d6 damage (Physical save for half), or control weather in a quarter-mile radius for one hour.'},
      // HIGH MAGIC — Level 5
      {tradition:'High Magic',lvl:5,name:'Abdication of Temporal Presence',desc:'Stop time for 1d4+1 rounds; you are frozen along with everything else and cannot affect the world. You can observe your frozen surroundings but cannot move, speak, or cast during this time.'},
      {tradition:'High Magic',lvl:5,name:'Banishment to the Black Glass Labyrinth',desc:'Exile one or more targets to an extradimensional maze from which escape requires a successful Mental save once per day. Lasts one day per caster level; survivors return to exactly where they were taken.'},
      {tradition:'High Magic',lvl:5,name:'The Dazzling Prismatic Hemicycle',desc:'A 100-foot cone of prismatic energy strikes all targets within it; each is struck by a randomly-determined color with devastating different effects: fire, lightning, petrification, madness, banishment, or death.'},
      {tradition:'High Magic',lvl:5,name:'Deluge of Hell',desc:'A torrent of devastation strikes everything in a 60-foot radius for 1d8 damage per caster level. After the spell resolves, you take one-quarter of the total damage dealt as the power rebounds through you.'},
      {tradition:'High Magic',lvl:5,name:'The Earth as Clay',desc:'Mold and reshape up to 1,000 cubic feet of natural stone and earth per level into any shape you desire. Worked structures resist this spell. The resulting shape is entirely permanent.'},
      {tradition:'High Magic',lvl:5,name:'Invocation of the Invincible Citadel',desc:'Instantly create a dome of impenetrable force 30 feet in diameter around yourself or a target point, cast as an Instant action. The dome lasts one scene or until you consciously dismiss it.'},
      {tradition:'High Magic',lvl:5,name:'Open the High Road',desc:'Create a teleportation gate to a distant point you have previously visited and prepared with a special marking ritual. The gate remains open for one minute; all who pass through arrive safely.'},
      // ELEMENTALIST — Level 1
      {tradition:'Elementalist',lvl:1,name:'Aqueous Harmony',desc:'You and up to twelve allies gain water-breathing, pressure and cold tolerance, and perfect underwater visual clarity for 1 hour per caster level. Movement and attacks are unhindered underwater; equipment is fully protected.'},
      {tradition:'Elementalist',lvl:1,name:'Elemental Favor',desc:'Appeal to a non-magical mass of earth, stone, water, flame, or air no larger than a 10-foot cube. At the end of the round it reshapes itself within its space as you request; if the new shape is stable, it persists after the scene.'},
      {tradition:'Elementalist',lvl:1,name:'Elemental Spy',desc:'Enchant a stone, ounce of liquid, flame, or smoke plume. For 1 day per caster level, you can as a Main Action see and hear everything around the enchanted object as if you were standing there in person.'},
      {tradition:'Elementalist',lvl:1,name:'Flame Scrying',desc:'Sense the approximate location of all open flames within 30 feet per caster level. Choose one as a focus to see and hear everything around it as if present. You may switch your scrying focus between detected flames at will while concentrating.'},
      // ELEMENTALIST — Level 2
      {tradition:'Elementalist',lvl:2,name:'Boreal Wings',desc:'A visible ally within 100 feet gains swift aerial flight at twice their normal movement rate for one scene (1 hour at level 5+, until dusk/dawn at level 8+). If the spell ends while they\'re aloft, they descend gently and safely.'},
      {tradition:'Elementalist',lvl:2,name:'The Burrower Below',desc:'Carve a tunnel up to 20 feet per caster level long through natural stone or earth, up to 10 feet wide and tall. Through worked stone the maximum length is only 2 feet per level. The tunnel can be left stable or made to collapse after passage.'},
      {tradition:'Elementalist',lvl:2,name:'Flame Without End',desc:'Make a sample of flame effectively eternal; it no longer consumes its fuel, resists all extinguishing except burial or total submersion, and can be temporarily suppressed by the caster. Used as a weapon it adds +2 damage. You may maintain one eternal flame per level.'},
      {tradition:'Elementalist',lvl:2,name:'Pact of Stone and Sea',desc:'Choose earth, water, fire, or air; the target becomes immune to mundane injury caused by that element for the rest of the scene. Stone weapons cannot harm them, water won\'t drown them, fire won\'t burn them, wind won\'t topple them.'},

      {tradition:'Elementalist',lvl:3,name:'Elemental Vallation',desc:'Raise a wall of a chosen element up to 10 feet per caster level long, 10 feet tall, and 1 foot thick. Fire walls deal 3d6 + level damage to those passing through; water walls eject small creatures; air walls deal 1d6 + level lightning damage; earth walls resist mining. Lasts one scene.'},
      {tradition:'Elementalist',lvl:3,name:'Like the Stones',desc:'Charge your body with one element\'s qualities for the rest of the scene. All forms grant immunity to poisons and diseases not already present. Earth: auto-stabilize, ignore 3 damage per hit. Water: pass through any gap. Air: fly at normal speed, +4 AC vs ranged. Fire: 1d6 damage to nearby foes each round.'},

      {tradition:'Necromancer',lvl:1,name:'Smite the Dead',desc:'A blast of dispelling force in a 20-foot radius at a point within 100 feet per level deals 1d10 damage per caster level to all hostile undead in the area. Undead with HD ≤ your level must make a Physical save or be destroyed outright. Can be cast by committing Effort without using a spell slot.'},
      {tradition:'Necromancer',lvl:1,name:'Terrible Liveliness',desc:'Give one undead creature the complete, tangible appearance of a living person at any point in its lifespan, including warmth, apparent breathing, and normal human activities. The disguise lasts until dispelled; you can maintain one per level without extra cost.'},
      // NECROMANCER — Level 2
      {tradition:'Necromancer',lvl:2,name:'Augment Mortal Vitality',desc:'Refine the life force of a willing visible target for the rest of the scene: Physical saves gain a bonus equal to your Magic skill, they auto-stabilize when Mortally Wounded, and once as an Instant they can heal all damage from a single injury. The recipient gains 1 System Strain.'},
      {tradition:'Necromancer',lvl:2,name:'Enfeebling Wave',desc:'A wash of debilitating force in a 20-foot radius at a visible point within 100 feet. On a failed Physical save, targets\' movement is halved and all attack and damage rolls are made twice with the worse result taken for the rest of the scene. A successful save limits the effect to one turn only.'},
      {tradition:'Necromancer',lvl:2,name:'Final Death',desc:'Curse one visible target per level; for the rest of the scene they cannot recover or gain hit points and die instantly if Mortally Wounded. After each failed healing attempt, a target may make a Physical save to throw off the curse.'},
      {tradition:'Necromancer',lvl:2,name:'Raise Corpse',desc:'Animate a mostly-intact skeleton or corpse as a suicidally loyal undead servant (1 HD, AC 13, Move 30\', attack +1/1d6). It obeys with human intelligence but has only vague memories of its prior life. You cannot maintain more active servants than your character level.'},

      {tradition:'Necromancer',lvl:3,name:'Festering Curse',desc:'Force the qualities of a rotting corpse onto a living target: food tastes like ash, water gives no relief, all physical pleasures become numb, and they suffer a −2 penalty to social skill checks. Does no physical damage. Targets with more HD than your level may Physical save to resist.'},
      {tradition:'Necromancer',lvl:3,name:'Forgetting the Grave',desc:'A willing target within sight simply cannot die for 1 round per Necromancer level regardless of injuries. At zero HP they lose their Move action but can still attack and cast. When the spell ends, those at zero HP are Mortally Wounded; those whose bodies are destroyed die instantly.'},
      {tradition:'Necromancer',lvl:3,name:'Merge Souls',desc:'Create a bond between two willing or helpless targets you can touch; they pool all hit points for the duration. Injuries to either reduce the shared pool; both are Mortally Wounded when it hits zero. They communicate telepathically at will. Ends at daybreak; if dispelled sooner, remaining HP splits proportionately.'},

      {tradition:'Necromancer',lvl:4,name:'Raise Grave Knight',desc:'Animate a corpse of at least 4 HD as a fully intelligent, devoted undead champion (4 HD, AC 15, Move 40\', attack +6/1d10, saves 13+, Morale 12). The knight remembers its prior life and regains all HP at dusk each day. You may only have one; a destroyed knight requires a month of painstaking ritual repair.'},

      {tradition:'Necromancer',lvl:5,name:'Call of the Tomb',desc:'Invoke the weight of mortality on all enemies within 40 feet. A Physical save limits the effect to one round; otherwise it lasts 1 round per caster level. During this time all attacks against affected targets automatically hit, all damage dice are maximized, and all mundane defenses are completely negated.'},
      {tradition:'Necromancer',lvl:5,name:'Everlasting',desc:'As an Instant action, flood all allied creatures within 50 feet with unstoppable life force; for 5 rounds none of them can be reduced below 1 hit point by any means. When the effect ends, you are left with only 1 hit point regardless of your total before casting.'},

        ochre: {
          name: 'Golden Wheat',
          bg: 'bg-[#FAF6ED]', cardBg: 'bg-[#FDFCF9]',
          primary: 'text-[#946F38]', border: 'border-[#E3D4B6]',
          accent: '#946F38', accentBg: 'bg-[#F3EAD3]',
          text: 'text-[#3B301F]', muted: 'text-[#7D6B4E]',
          ring: 'focus:ring-[#946F38]', inputBg: 'bg-[#FDFBF7]',
          paperTexture: 'radial-gradient(circle, rgba(243,234,211,0.2) 0%, rgba(250,246,237,0) 70%)'
        }
      };

      const [activeThemeKey, setActiveThemeKey] = useState('terracotta');
      const theme = themes[activeThemeKey];
      const [editMode, setEditMode] = useState(true);
      const [activeTab, setActiveTab] = useState('primary');
      const [showSpellPicker, setShowSpellPicker] = useState(false);
      const [spellFilter, setSpellFilter] = useState({ search: '', level: 'all', tradition: 'all' });
      const [showNotification, setShowNotification] = useState(false);
      const [notificationMsg, setNotificationMsg] = useState('');

      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasSigil, setHasSigil] = useState(false);

      const [char, setChar] = useState({
        name: '', worlds: '', level: '1', player: '', xp: '0',
        homeland: '', occupation: '', characterClass: '', race: 'Human',
        goal: '', description: '', classBenefits: '', background: '',

        str: '10', strMod: '+0', dex: '10', dexMod: '+0',
        con: '10', conMod: '+0', int: '10', intMod: '+0',
        wis: '10', wisMod: '+0', cha: '10', chaMod: '+0',

        hpMax: '0', hpCurrent: '0',
        systemStrainMax: '10', systemStrainCurrent: '0',
        acWorn: '', acTotal: '10',
        bab: '+0', meleeBonus: '+0', rangedBonus: '+0', initiative: '+0',

        // Saves are roll-equal-or-over target numbers (lower is better)
        savePhys: '15', saveEvasion: '15', saveMental: '15', saveLuck: '15',

        ammoMax: '20', ammoCurrent: '0',
        weapons: [],

        // All skills start untrained (-1 penalty in WWN)
        skills: {
          Administer: '-1', Connect: '-1', Convince: '-1', Craft: '-1', Exert: '-1',
          Heal: '-1', Know: '-1', Lead: '-1', Magic: '-1', Notice: '-1',
          Perform: '-1', Pray: '-1', Punch: '-1', Ride: '-1', Sail: '-1',
          Shoot: '-1', Sneak: '-1', Stab: '-1', Survive: '-1', Trade: '-1', Work: '-1'
        },
        skillPoints: '0',
        foci: [],

        wealth: { gp: '0', sp: '0', cp: '0', items: '' },
        mount: { name: '', ac: '10', hp: '0', type: '', speed: '', gear: '', capacity: '', morale: '', attack: '' },
        languages: '',

        renown: '0', projectEffortCurrent: '0', projectEffortMax: '0',
        projects: '', notes: '',

        magicEffortMax: '0', magicEffortCurrent: '0',
        tradition: '', tradition2: '', casterType: 'none',
        arts: [], spells: [],

        // Readied = STR÷2 (rounded down); Stowed = STR score (WWN p.32)
        readiedItems: Array(10).fill(null).map(() => ({ item: '', wgt: '' })),
        stowedItems: Array(12).fill(null).map(() => ({ item: '', wgt: '' })),
        storedItems: [],
        alliesEnemies: []
      });

      // Load character from generator (localStorage) or postMessage
      useEffect(() => {
        const pending = localStorage.getItem('wwn-sheet-pending');
        if (pending) {
          try {
            const data = JSON.parse(pending);
            setChar(prev => ({
              ...prev, ...data,
              readiedItems: data.readiedItems || Array(10).fill(null).map(() => ({ item: '', wgt: '' })),
              stowedItems:  data.stowedItems  || Array(12).fill(null).map(() => ({ item: '', wgt: '' })),
            }));
            localStorage.removeItem('wwn-sheet-pending');
            notify(`Loaded ${data.name || 'character'} from generator!`);
          } catch (e) {}
        }

        const handleExternalMessage = (event) => {
          if (event.data && event.data.type === 'LOAD_WWN_CHARACTER') {
            const loadedChar = event.data.characterData;
            if (loadedChar) {
              setChar(prev => ({
                ...prev, ...loadedChar,
                readiedItems: loadedChar.readiedItems || Array(10).fill({ item: '', wgt: '' }),
                stowedItems:  loadedChar.stowedItems  || Array(12).fill({ item: '', wgt: '' })
              }));
              notify(`Imported ${loadedChar.name || 'new traveler'} from generator!`);
            }
          }
        };

        window.addEventListener('message', handleExternalMessage);
        window.loadWwnCharacter = (characterData) => {
          if (characterData) {
            setChar(prev => ({ ...prev, ...characterData }));
            notify('Character sheet updated!');
          }
        };

        return () => {
          window.removeEventListener('message', handleExternalMessage);
          delete window.loadWwnCharacter;
        };
      }, []);

      // WWN modifier table (p.7)
      const calcMod = (val) => {
        const n = parseInt(val, 10);
        if (isNaN(n)) return '+0';
        if (n <= 3)  return '-2';
        if (n <= 7)  return '-1';
        if (n <= 13) return '+0';
        if (n <= 17) return '+1';
        return '+2';
      };

      const handleAttrChange = (attr, val) => {
        setChar(prev => {
          const u = { ...prev, [attr]: val };
          if (attr === 'str') u.strMod = calcMod(val);
          if (attr === 'dex') u.dexMod = calcMod(val);
          if (attr === 'con') u.conMod = calcMod(val);
          if (attr === 'int') u.intMod = calcMod(val);
          if (attr === 'wis') u.wisMod = calcMod(val);
          if (attr === 'cha') u.chaMod = calcMod(val);
          return u;
        });
      };

      const notify = (msg) => {
        setNotificationMsg(msg);
        setShowNotification(true);
        setTimeout(() => setShowNotification(false), 3000);
      };

      const getSpellSlots = () => {
        const tbl = SPELL_TABLES[char.casterType];
        if (!tbl) return null;
        const lvl = Math.min(Math.max(parseInt(char.level, 10) || 1, 1), 10);
        return tbl[lvl - 1]; // [maxSpellLevel, castsPerDay, preparedLimit]
      };

      const tradBadge = (t) => {
        if (t === 'High Magic') return 'bg-blue-100 text-blue-700';
        if (t === 'Elementalist') return 'bg-amber-100 text-amber-700';
        if (t === 'Necromancer') return 'bg-purple-100 text-purple-700';
        return 'bg-neutral-200 text-neutral-600';
      };

      const handleExport = () => {
        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(char, null, 2))}`;
        const a = document.createElement('a');
        a.setAttribute('href', jsonString);
        a.setAttribute('download', `${(char.name || 'Unmade_Traveler').replace(/\s+/g, '_')}_sheet.json`);
        document.body.appendChild(a); a.click(); a.remove();
        notify('Character exported!');
      };

      const handleImport = (e) => {
        const reader = new FileReader();
        reader.readAsText(e.target.files[0], 'UTF-8');
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            setChar({ ...char, ...parsed });
            notify('Character imported!');
          } catch { notify('That file doesn\'t look right.'); }
        };
      };

      useEffect(() => {
        if (canvasRef.current) {
          const ctx = canvasRef.current.getContext('2d');
          ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.strokeStyle = theme.accent;
        }
      }, [canvasRef, theme]);

      const startDrawing = ({ nativeEvent }) => {
        const { offsetX, offsetY } = nativeEvent;
        const ctx = canvasRef.current?.getContext('2d');
        if (!ctx) return;
        ctx.beginPath(); ctx.moveTo(offsetX, offsetY);
        setIsDrawing(true); setHasSigil(true);
      };
      const draw = ({ nativeEvent }) => {
        if (!isDrawing) return;
        const { offsetX, offsetY } = nativeEvent;
        const ctx = canvasRef.current?.getContext('2d');
        if (!ctx) return;
        ctx.lineTo(offsetX, offsetY); ctx.stroke();
      };
      const stopDrawing = () => setIsDrawing(false);
      const clearSigil = () => {
        const canvas = canvasRef.current; if (!canvas) return;
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        setHasSigil(false);
      };

      const addWeapon    = () => setChar(p => ({ ...p, weapons:     [...p.weapons,     { name: 'New Weapon',      toHit: '+0', damage: '1d6', range: 'Melee', special: '' }] }));
      const removeWeapon = (i) => setChar(p => ({ ...p, weapons:     p.weapons.filter((_,j)=>j!==i) }));
      const addFocus     = () => setChar(p => ({ ...p, foci:        [...p.foci,        { name: 'New Focus',        details: '' }] }));
      const removeFocus  = (i) => setChar(p => ({ ...p, foci:        p.foci.filter((_,j)=>j!==i) }));
      const addArt       = () => setChar(p => ({ ...p, arts:        [...p.arts,        { name: 'New Art',          details: '' }] }));
      const removeArt    = (i) => setChar(p => ({ ...p, arts:        p.arts.filter((_,j)=>j!==i) }));
      const addSpell     = () => setChar(p => ({ ...p, spells:      [...p.spells,      { lvl: '1', name: 'Custom Spell', prep: false, details: '', tradition: 'Custom' }] }));
      const removeSpell  = (i) => setChar(p => ({ ...p, spells:      p.spells.filter((_,j)=>j!==i) }));
      const addStoredItem    = () => setChar(p => ({ ...p, storedItems:   [...p.storedItems,   { item: 'Stored Item',  loc: 'Safe Location' }] }));
      const removeStoredItem = (i) => setChar(p => ({ ...p, storedItems:   p.storedItems.filter((_,j)=>j!==i) }));
      const addAlly      = () => setChar(p => ({ ...p, alliesEnemies: [...p.alliesEnemies, { name: 'Name', location: 'Region', status: 'Uncertain' }] }));
      const removeAlly   = (i) => setChar(p => ({ ...p, alliesEnemies: p.alliesEnemies.filter((_,j)=>j!==i) }));

      const BohemianSeparator = () => (
        <div className="flex items-center justify-center my-6 opacity-65">
          <div className={`h-px flex-1 ${theme.border} border-t max-w-[120px]`}></div>
          <div className={`mx-3 ${theme.primary} flex space-x-1`}>
            <Leaf size={14} className="rotate-45" />
            <Leaf size={14} className="-rotate-12 transform scale-x-[-1]" />
          </div>
          <div className={`h-px flex-1 ${theme.border} border-t max-w-[120px]`}></div>
        </div>
      );

      // Inline field helper to reduce repetition
      const Field = ({ label, stateKey, large, italic }) => (
        <div>
          <label className={`text-[10px] uppercase tracking-widest font-serif font-semibold ${theme.primary}`}>{label}</label>
          {editMode ? (
            large
              ? <textarea value={char[stateKey]} onChange={e => setChar({...char, [stateKey]: e.target.value})}
                  rows="2" className={`w-full text-xs font-serif italic border border-dashed p-1.5 rounded-lg ${theme.border} ${theme.inputBg} focus:outline-none`} />
              : <input type="text" value={char[stateKey]} onChange={e => setChar({...char, [stateKey]: e.target.value})}
                  className={`w-full text-sm border-b ${theme.border} ${theme.inputBg} py-1 mt-0.5 focus:outline-none`} />
          ) : (
            <p className={`text-sm font-medium pt-1 border-b border-transparent min-h-[28px] ${italic ? 'italic' : ''}`}>
              {char[stateKey] || '---'}
            </p>
          )}
        </div>
      );

      return (
        <div className={`min-h-screen ${theme.bg} ${theme.text} font-sans transition-colors duration-500 pb-12`}>

          {/* Decorative top vine */}
          <div className="absolute top-0 left-0 right-0 h-4 overflow-hidden opacity-30 select-none pointer-events-none">
            <svg className="w-full h-full" fill="currentColor" viewBox="0 0 1200 24" preserveAspectRatio="none">
              <path d="M0,0 C150,15 350,-10 500,10 C650,30 850,-5 1000,15 C1150,35 1200,0 1200,0 L1200,24 L0,24 Z" className="opacity-10" />
            </svg>
          </div>

          {/* Header toolbar */}
          <header className="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-neutral-200/60 shadow-xs px-4 py-3 print:hidden">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              <div className="flex items-center space-x-3">
                <div className={`p-2 rounded-full ${theme.accentBg} ${theme.primary}`}>
                  <Feather size={20} className="animate-pulse" />
                </div>
                <div>
                  <h1 className="font-serif text-xl font-bold tracking-wide">Worlds Without Number</h1>
                  <p className="text-xs text-neutral-500 font-medium">Bohemian Artisan Character Portfolio</p>
                </div>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                {/* Theme selector */}
                <div className="flex items-center space-x-1 bg-neutral-100 rounded-lg p-1">
                  {Object.keys(themes).map(tKey => (
                    <button key={tKey} onClick={() => setActiveThemeKey(tKey)}
                      className={`text-xs px-2.5 py-1.5 rounded-md font-medium transition-all ${
                        activeThemeKey === tKey
                          ? `${themes[tKey].primary} ${themes[tKey].cardBg} shadow-xs font-semibold`
                          : 'text-neutral-500 hover:text-neutral-900'
                      }`}>
                      {themes[tKey].name.split(' ')[0]}
                    </button>
                  ))}
                </div>

                {/* Edit / Preview toggle */}
                <button onClick={() => setEditMode(!editMode)}
                  className={`flex items-center space-x-1.5 px-3 py-1.5 rounded-lg text-sm font-medium transition-all ${
                    editMode ? 'bg-neutral-800 text-white hover:bg-neutral-900' : `${theme.accentBg} ${theme.primary}`
                  }`}>
                  {editMode ? <Eye size={16} /> : <Edit3 size={16} />}
                  <span>{editMode ? 'Lock & Preview' : 'Unlock & Edit'}</span>
                </button>

                {/* Print / Export / Import */}
                <div className="flex items-center space-x-1 bg-neutral-50 p-1 rounded-lg border border-neutral-200">
                  <button onClick={() => window.print()} title="Print" className="p-1.5 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 rounded-md transition"><Printer size={17} /></button>
                  <button onClick={handleExport} title="Export JSON" className="p-1.5 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 rounded-md transition"><Download size={17} /></button>
                  <label title="Import JSON" className="p-1.5 text-neutral-600 hover:text-neutral-900 hover:bg-neutral-100 rounded-md transition cursor-pointer">
                    <Upload size={17} />
                    <input type="file" accept=".json" onChange={handleImport} className="hidden" />
                  </label>
                </div>
              </div>
            </div>
          </header>

          {/* Toast notification */}
          {showNotification && (
            <div className="fixed bottom-6 right-6 z-50 bg-neutral-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 animate-fade-in-up">
              <Sparkles size={16} className="text-yellow-400" />
              <span className="text-sm font-medium">{notificationMsg}</span>
            </div>
          )}

          <main className="max-w-6xl mx-auto px-4 mt-6 print:mt-0">

            {/* Tab nav */}
            <div className="flex justify-center space-x-2 mb-6 print:hidden">
              {[['primary','I. Core & Combat'],['secondary','II. Spells & Projects'],['inventory','III. Belongings & Storage']].map(([key, label]) => (
                <button key={key} onClick={() => setActiveTab(key)}
                  className={`px-4 py-2 rounded-xl text-sm font-semibold tracking-wider uppercase font-serif transition ${
                    activeTab === key ? `${theme.primary} ${theme.accentBg} border-b-2 border-current shadow-xs` : 'text-neutral-400 hover:text-neutral-700'
                  }`}>
                  {label}
                </button>
              ))}
            </div>

            {/* ═══════════════════════════════════════════════════
                PAGE 1: CORE & COMBAT
            ═══════════════════════════════════════════════════ */}
            <div className={`${activeTab === 'primary' ? 'block' : 'hidden print:block'} space-y-6 print:space-y-4`}>

              {/* Character header card */}
              <section className={`relative rounded-3xl p-6 md:p-8 ${theme.cardBg} border ${theme.border} shadow-xs overflow-hidden`}>
                <div className="absolute inset-0 opacity-40 pointer-events-none" style={{ backgroundImage: theme.paperTexture }}></div>
                <div className={`absolute top-4 right-4 ${theme.primary} opacity-35 pointer-events-none`}>
                  <svg width="48" height="48" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="2">
                    <circle cx="50" cy="50" r="35" strokeDasharray="4,4" />
                    <path d="M50 5 L50 95 M5 50 L95 50" />
                    <polygon points="50,15 54,46 85,50 54,54 50,85 46,54 15,50 46,46" fill="currentColor" />
                  </svg>
                </div>
                <div className={`absolute top-4 left-4 ${theme.primary} opacity-35 pointer-events-none`}>
                  <svg width="32" height="32" viewBox="0 0 100 100" fill="none" stroke="currentColor" strokeWidth="2">
                    <path d="M20,50 A30,30 0 1,1 80,50 A30,30 0 1,1 20,50" />
                    <path d="M40,50 A10,10 0 1,0 60,50 A10,10 0 1,0 40,50" fill="currentColor" />
                  </svg>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-12 gap-6 relative z-10">
                  {/* Col 1: Name + Homeland/Occupation */}
                  <div className="md:col-span-5 space-y-4">
                    <div>
                      <label className={`text-[10px] uppercase tracking-widest font-serif font-semibold ${theme.primary}`}>Character Name</label>
                      {editMode
                        ? <input type="text" value={char.name} onChange={e => setChar({...char, name: e.target.value})}
                            placeholder="e.g. Lysander Sterling"
                            className={`w-full font-serif text-3xl font-bold border-b ${theme.border} ${theme.inputBg} focus:outline-none py-1 mt-1`} />
                        : <h2 className="font-serif text-4xl font-bold text-neutral-900 border-b border-transparent py-1 mt-1 min-h-[48px]">{char.name || 'Unmade Traveler'}</h2>
                      }
                    </div>
                    <div className="grid grid-cols-2 gap-4">
                      <Field label="Homeland"   stateKey="homeland" />
                      <Field label="Class"       stateKey="characterClass" />
                    </div>
                  </div>

                  {/* Col 2: Background/Race/Level/XP */}
                  <div className="md:col-span-4 grid grid-cols-2 gap-4 border-l border-r border-dashed border-neutral-300/60 px-0 md:px-6">
                    <Field label="Background"   stateKey="background" />
                    <Field label="Occupation"   stateKey="occupation" />
                    <div>
                      <label className={`text-[10px] uppercase tracking-widest font-serif font-semibold ${theme.primary}`}>Level</label>
                      {editMode
                        ? <input type="text" value={char.level} onChange={e => setChar({...char, level: e.target.value})}
                            className={`w-full text-sm border-b ${theme.border} ${theme.inputBg} py-1 mt-0.5 focus:outline-none`} />
                        : <p className="text-sm font-medium pt-1 border-b border-transparent min-h-[28px]">Level {char.level}</p>
                      }
                    </div>
                    <div>
                      <label className={`text-[10px] uppercase tracking-widest font-serif font-semibold ${theme.primary}`}>XP</label>
                      {editMode
                        ? <input type="text" value={char.xp} onChange={e => setChar({...char, xp: e.target.value})}
                            className={`w-full text-sm border-b ${theme.border} ${theme.inputBg} py-1 mt-0.5 focus:outline-none`} />
                        : <p className="text-sm font-medium pt-1 border-b border-transparent min-h-[28px]">{char.xp} XP</p>
                      }
                    </div>
                  </div>

                  {/* Col 3: Goal / Worlds */}
                  <div className="md:col-span-3 space-y-4">
                    <Field label="Character Goal" stateKey="goal" large italic />
                    <Field label="Worlds / Sphere" stateKey="worlds" />
                  </div>
                </div>
              </section>

              {/* Attributes + Vitals row */}
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">

                {/* Six attribute cards */}
                <div className="lg:col-span-7 grid grid-cols-2 sm:grid-cols-3 gap-4">
                  {[
                    { label:'Strength',     key:'str', modKey:'strMod', desc:'Might & Burden' },
                    { label:'Dexterity',    key:'dex', modKey:'dexMod', desc:'Grace & Reflex' },
                    { label:'Constitution', key:'con', modKey:'conMod', desc:'Vigor & Fortitude' },
                    { label:'Intelligence', key:'int', modKey:'intMod', desc:'Reason & Lore' },
                    { label:'Wisdom',       key:'wis', modKey:'wisMod', desc:'Intuition & Spirit' },
                    { label:'Charisma',     key:'cha', modKey:'chaMod', desc:'Presence & Grace' },
                  ].map(attr => (
                    <div key={attr.key}
                      className={`relative p-4 rounded-2xl ${theme.cardBg} border ${theme.border} flex flex-col items-center text-center shadow-xs overflow-hidden group`}>
                      <div className={`absolute -top-6 -right-6 w-12 h-12 rounded-full ${theme.accentBg} opacity-10 group-hover:scale-150 transition-all duration-300`}></div>
                      <span className={`text-[9px] uppercase tracking-widest font-serif font-bold ${theme.primary}`}>{attr.label}</span>
                      <span className="text-[9px] text-neutral-400 italic mb-2">{attr.desc}</span>
                      {editMode
                        ? <input type="number" value={char[attr.key]} onChange={e => handleAttrChange(attr.key, e.target.value)}
                            className="w-16 text-center text-2xl font-serif font-bold bg-neutral-100 rounded-lg p-1" />
                        : <span className="text-3xl font-serif font-bold text-neutral-800">{char[attr.key]}</span>
                      }
                      <div className={`mt-2 px-3 py-0.5 rounded-full ${theme.accentBg} text-[11px] font-bold ${theme.primary}`}>
                        Modifier: {char[attr.modKey]}
                      </div>
                    </div>
                  ))}
                </div>

                {/* Vitals card */}
                <div className={`lg:col-span-5 rounded-3xl p-6 ${theme.cardBg} border ${theme.border} space-y-4 shadow-xs`}>
                  <h3 className={`font-serif text-lg font-bold ${theme.primary} tracking-wide border-b ${theme.border} pb-2 flex items-center justify-between`}>
                    <span>Vitals & Protections</span>
                    <Compass size={16} />
                  </h3>

                  <div className="grid grid-cols-2 gap-4">
                    {/* HP */}
                    <div className="border border-dashed border-neutral-300 p-3 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-serif uppercase tracking-wider font-bold">Hit Points</span>
                        <Heart size={14} className="text-red-500 fill-red-500/10" />
                      </div>
                      <div className="flex items-baseline space-x-1.5 my-2">
                        {editMode
                          ? <input type="number" value={char.hpCurrent} onChange={e => setChar({...char, hpCurrent: e.target.value})} className="w-12 text-xl font-bold bg-neutral-100 rounded p-1" />
                          : <span className="text-2xl font-bold text-neutral-800">{char.hpCurrent}</span>
                        }
                        <span className="text-neutral-400 text-sm">/</span>
                        {editMode
                          ? <input type="number" value={char.hpMax} onChange={e => setChar({...char, hpMax: e.target.value})} className="w-12 text-xl font-bold bg-neutral-100 rounded p-1" />
                          : <span className="text-xl text-neutral-600 font-medium">{char.hpMax}</span>
                        }
                      </div>
                      <span className="text-[9px] text-neutral-400">Max HP</span>
                    </div>

                    {/* System Strain */}
                    <div className="border border-dashed border-neutral-300 p-3 rounded-2xl flex flex-col justify-between">
                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-serif uppercase tracking-wider font-bold">System Strain</span>
                        <Shield size={14} className={theme.primary} />
                      </div>
                      <div className="flex items-baseline space-x-1.5 my-2">

                      if (spellFilter.level !== 'all' && String(s.lvl) !== spellFilter.level) return false;

                        if (!accessibleTrads.has(s.tradition)) return false;

          <footer className="mt-12 text-center text-xs text-neutral-400 space-y-1 print:hidden select-none">

            <p className="font-serif italic text-sm">"By quill, and sword, and herb, our path is woven."</p>
            <p className="text-[10px]">Worlds Without Number is a trademark of Sine Nomine Publishing.</p>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
