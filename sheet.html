<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WWN Character Sheet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
            sans: ['Montserrat', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            xs: '0 1px 2px 0 rgb(0 0 0 / 0.05)',
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.3s ease-out',
            'spin-slow': 'spin 40s linear infinite',
          },
          keyframes: {
            fadeInUp: {
              from: { opacity: '0', transform: 'translateY(10px)' },
              to:   { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide-react/dist/umd/lucide-react.min.js"></script>
  <style>
    @media print {
      .print\:hidden { display: none !important; }
      .print\:block  { display: block !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    } = lucideReact;

      partial: [[1,1,2],[1,1,3],[1,1,3],[1,2,4],[2,2,5],[2,3,6],[2,3,7],[2,3,7],[3,4,8],[3,4,9]],

    const SPELL_LIST = [
      // HIGH MAGIC — Level 1

      {tradition:'High Magic',lvl:2,name:'Prudentially Transient Abnegation of Life',desc:'Willing target at zero HP appears to die, but later revives.'},

      {tradition:'High Magic',lvl:5,name:'Banishment to the Black Glass Labyrinth',desc:'Exile targets to an extradimensional prison-maze.'},
      {tradition:'High Magic',lvl:5,name:'The Dazzling Prismatic Hemicycle',desc:'Blast targets in 100-ft cone with random gruesome effects.'},
      {tradition:'High Magic',lvl:5,name:'Deluge of Hell',desc:'1d8 dmg/level in huge area, but risk taking a quarter yourself.'},
      {tradition:'High Magic',lvl:5,name:'The Earth as Clay',desc:'Mold and shape natural stone and earth in very large area.'},
      {tradition:'High Magic',lvl:5,name:'Invocation of the Invincible Citadel',desc:'Create a force-shield bubble as an Instant action.'},

      // ELEMENTALIST — Level 1
      {tradition:'Elementalist',lvl:1,name:'Aqueous Harmony',desc:'You and up to twelve allies breathe water and swim freely for 1 hr/level.'},

      {tradition:'Elementalist',lvl:1,name:'Flame Scrying',desc:'Sense all open flames within 30 ft/level and scry through one.'},

      {tradition:'Elementalist',lvl:2,name:'Flame Without End',desc:'Make a flame effectively eternal; it no longer consumes its fuel.'},
      {tradition:'Elementalist',lvl:2,name:'Pact of Stone and Sea',desc:'Grant immunity to mundane manifestations of one chosen element for a scene.'},
      // ELEMENTALIST — Level 3
      {tradition:'Elementalist',lvl:3,name:'Elemental Vallation',desc:'Raise a wall of elemental force 10 ft/level long.'},
      {tradition:'Elementalist',lvl:3,name:'Like the Stones',desc:'Charge your body with an element\'s qualities for the rest of the scene.'},

      // NECROMANCER — Level 1
      {tradition:'Necromancer',lvl:1,name:'Command the Dead',desc:'Control undead up to 2× level HD; Mental save at −Magic skill to resist.'},
      {tradition:'Necromancer',lvl:1,name:'Query the Skull',desc:'Interrogate a corpse; it answers one question/level truthfully.'},
      {tradition:'Necromancer',lvl:1,name:'Smite the Dead',desc:'1d10 dmg/level to hostile undead in area; low-HD undead may be destroyed.'},
      {tradition:'Necromancer',lvl:1,name:'Terrible Liveliness',desc:'Give undead the tangible appearance and manner of living health.'},
      // NECROMANCER — Level 2
      {tradition:'Necromancer',lvl:2,name:'Augment Mortal Vitality',desc:'Target gains Physical save bonus equal to Magic skill and auto-stabilizes.'},
      {tradition:'Necromancer',lvl:2,name:'Enfeebling Wave',desc:'Living creatures in 20-ft radius halved in move and attack on failed Physical save.'},
      {tradition:'Necromancer',lvl:2,name:'Final Death',desc:'Cursed targets cannot heal and die instantly if Mortally Wounded.'},
      {tradition:'Necromancer',lvl:2,name:'Raise Corpse',desc:'Animate a skeleton or corpse as a suicidally loyal 1 HD undead servant.'},
      // NECROMANCER — Level 3
      {tradition:'Necromancer',lvl:3,name:'Compel Flesh',desc:'Paralyze target\'s body; their mind is free but their flesh obeys your commands.'},
      {tradition:'Necromancer',lvl:3,name:'Festering Curse',desc:'Curse target with rotting aspects and joylessness (−2 to social checks).'},
      {tradition:'Necromancer',lvl:3,name:'Forgetting the Grave',desc:'Target simply cannot die for 1 round/level, no matter the injuries.'},
      {tradition:'Necromancer',lvl:3,name:'Merge Souls',desc:'Bond two willing targets to share a pooled hit point total.'},
      // NECROMANCER — Level 4
      {tradition:'Necromancer',lvl:4,name:'Boneshaper',desc:'Reshape flesh and bone of willing or helpless creature into any equivalent form.'},
      {tradition:'Necromancer',lvl:4,name:'Raise Grave Knight',desc:'Animate a powerful 4 HD undead champion, fully intelligent and loyal.'},
      // NECROMANCER — Level 5
      {tradition:'Necromancer',lvl:5,name:'Call of the Tomb',desc:'All attacks against targets within 40 ft auto-hit with maximized damage.'},
      {tradition:'Necromancer',lvl:5,name:'Everlasting',desc:'All allies in 50 ft can\'t be reduced below 1 HP for 5 rounds; you drop to 1 HP.'},
    ];

    function App() {
      const themes = {
        terracotta: {
          name: 'Terracotta Sun',
          bg: 'bg-[#F9F6F0]', cardBg: 'bg-[#FCFBF7]',
          primary: 'text-[#8C4F3E]', border: 'border-[#D9C5B2]',
          accent: '#8C4F3E', accentBg: 'bg-[#EAD9C9]',
          text: 'text-[#3E3835]', muted: 'text-[#7A6F6A]',
          ring: 'focus:ring-[#8C4F3E]', inputBg: 'bg-[#FDFCF7]',
          paperTexture: 'radial-gradient(circle, rgba(234,217,201,0.15) 0%, rgba(249,246,240,0) 70%)'
        },
        sage: {
          name: 'Sage Herb',
          bg: 'bg-[#F2F4F0]', cardBg: 'bg-[#FAFBF9]',
          primary: 'text-[#4A5D4E]', border: 'border-[#CBD3C6]',
          accent: '#4A5D4E', accentBg: 'bg-[#DFE4DC]',
          text: 'text-[#2D352F]', muted: 'text-[#647067]',
          ring: 'focus:ring-[#4A5D4E]', inputBg: 'bg-[#F7F9F6]',
          paperTexture: 'radial-gradient(circle, rgba(223,228,220,0.2) 0%, rgba(242,244,240,0) 70%)'
        },
        twilight: {
          name: 'Celestial Twilight',
          bg: 'bg-[#EAEAF2]', cardBg: 'bg-[#F4F4FA]',
          primary: 'text-[#44406B]', border: 'border-[#CCD0E0]',
          accent: '#44406B', accentBg: 'bg-[#DDDDF2]',
          text: 'text-[#28253B]', muted: 'text-[#5C5775]',
          ring: 'focus:ring-[#44406B]', inputBg: 'bg-[#F8F8FD]',
          paperTexture: 'radial-gradient(circle, rgba(221,221,242,0.2) 0%, rgba(234,234,242,0) 70%)'
        },
        ochre: {
          name: 'Golden Wheat',
          bg: 'bg-[#FAF6ED]', cardBg: 'bg-[#FDFCF9]',
          primary: 'text-[#946F38]', border: 'border-[#E3D4B6]',
          accent: '#946F38', accentBg: 'bg-[#F3EAD3]',
          text: 'text-[#3B301F]', muted: 'text-[#7D6B4E]',
          ring: 'focus:ring-[#946F38]', inputBg: 'bg-[#FDFBF7]',
          paperTexture: 'radial-gradient(circle, rgba(243,234,211,0.2) 0%, rgba(250,246,237,0) 70%)'
        }
      };

      const [activeThemeKey, setActiveThemeKey] = useState('terracotta');
      const theme = themes[activeThemeKey];
      const [editMode, setEditMode] = useState(true);
      const [activeTab, setActiveTab] = useState('primary');
      const [showSpellPicker, setShowSpellPicker] = useState(false);
      const [spellFilter, setSpellFilter] = useState({ search: '', level: 'all', tradition: 'all' });
      const [showNotification, setShowNotification] = useState(false);
      const [notificationMsg, setNotificationMsg] = useState('');

      const canvasRef = useRef(null);
      const [isDrawing, setIsDrawing] = useState(false);
      const [hasSigil, setHasSigil] = useState(false);

      const [char, setChar] = useState({
        name: '', worlds: '', level: '1', player: '', xp: '0',
        homeland: '', occupation: '', characterClass: '', race: 'Human',
        goal: '', description: '', classBenefits: '', background: '',

        str: '10', strMod: '+0', dex: '10', dexMod: '+0',
        con: '10', conMod: '+0', int: '10', intMod: '+0',
        wis: '10', wisMod: '+0', cha: '10', chaMod: '+0',

        hpMax: '0', hpCurrent: '0',
        systemStrainMax: '10', systemStrainCurrent: '0',
        acWorn: '', acTotal: '10',
        bab: '+0', meleeBonus: '+0', rangedBonus: '+0', initiative: '+0',

        // Saves are roll-equal-or-over target numbers (lower is better)
        savePhys: '15', saveEvasion: '15', saveMental: '15', saveLuck: '15',

        ammoMax: '20', ammoCurrent: '0',
        weapons: [],

        // All skills start untrained (-1 penalty in WWN)
        skills: {
          Administer: '-1', Connect: '-1', Convince: '-1', Craft: '-1', Exert: '-1',
          Heal: '-1', Know: '-1', Lead: '-1', Magic: '-1', Notice: '-1',
          Perform: '-1', Pray: '-1', Punch: '-1', Ride: '-1', Sail: '-1',
          Shoot: '-1', Sneak: '-1', Stab: '-1', Survive: '-1', Trade: '-1', Work: '-1'
        },
        skillPoints: '0',
        foci: [],

        wealth: { gp: '0', sp: '0', cp: '0', items: '' },
        mount: { name: '', ac: '10', hp: '0', type: '', speed: '', gear: '', capacity: '', morale: '', attack: '' },
        languages: '',

        renown: '0', projectEffortCurrent: '0', projectEffortMax: '0',
        projects: '', notes: '',

        magicEffortMax: '0', magicEffortCurrent: '0',
        tradition: '', tradition2: '', casterType: 'none',
        arts: [], spells: [],

        // Readied = STR÷2 (rounded down); Stowed = STR score (WWN p.32)
        readiedItems: Array(10).fill(null).map(() => ({ item: '', wgt: '' })),
        stowedItems: Array(12).fill(null).map(() => ({ item: '', wgt: '' })),
        storedItems: [],
        alliesEnemies: []
      });

      // Load character from generator (localStorage) or postMessage
      useEffect(() => {
        const pending = localStorage.getItem('wwn-sheet-pending');
        if (pending) {
          try {
            const data = JSON.parse(pending);
            setChar(prev => ({
              ...prev, ...data,
              readiedItems: data.readiedItems || Array(10).fill(null).map(() => ({ item: '', wgt: '' })),
              stowedItems:  data.stowedItems  || Array(12).fill(null).map(() => ({ item: '', wgt: '' })),
            }));
            localStorage.removeItem('wwn-sheet-pending');
            notify(`Loaded ${data.name || 'character'} from generator!`);
          } catch (e) {}
        }

        const handleExternalMessage = (event) => {
          if (event.data && event.data.type === 'LOAD_WWN_CHARACTER') {
            const loadedChar = event.data.characterData;
            if (loadedChar) {
              setChar(prev => ({
                ...prev, ...loadedChar,
                readiedItems: loadedChar.readiedItems || Array(10).fill({ item: '', wgt: '' }),
                stowedItems:  loadedChar.stowedItems  || Array(12).fill({ item: '', wgt: '' })
              }));
              notify(`Imported ${loadedChar.name || 'new traveler'} from generator!`);
            }
          }
        };

        window.addEventListener('message', handleExternalMessage);
        window.loadWwnCharacter = (characterData) => {
          if (characterData) {
            setChar(prev => ({ ...prev, ...characterData }));
            notify('Character sheet updated!');
          }
        };

        return () => {
          window.removeEventListener('message', handleExternalMessage);
          delete window.loadWwnCharacter;
        };
      }, []);

      // WWN modifier table (p.7)
      const calcMod = (val) => {
        const n = parseInt(val, 10);
        if (isNaN(n)) return '+0';
        if (n <= 3)  return '-2';
        if (n <= 7)  return '-1';
        if (n <= 13) return '+0';
        if (n <= 17) return '+1';
        return '+2';
      };

      const handleAttrChange = (attr, val) => {
        setChar(prev => {
          const u = { ...prev, [attr]: val };
          if (attr === 'str') u.strMod = calcMod(val);
          if (attr === 'dex') u.dexMod = calcMod(val);
          if (attr === 'con') u.conMod = calcMod(val);
          if (attr === 'int') u.intMod = calcMod(val);
          if (attr === 'wis') u.wisMod = calcMod(val);
          if (attr === 'cha') u.chaMod = calcMod(val);
          return u;
        });
      };

      const notify = (msg) => {
        setNotificationMsg(msg);
        setShowNotification(true);
        setTimeout(() => setShowNotification(false), 3000);
      };

      const getSpellSlots = () => {
        const tbl = SPELL_TABLES[char.casterType];
        if (!tbl) return null;
        const lvl = Math.min(Math.max(parseInt(char.level, 10) || 1, 1), 10);
        return tbl[lvl - 1]; // [maxSpellLevel, castsPerDay, preparedLimit]
      };

      const tradBadge = (t) => {
        if (t === 'High Magic') return 'bg-blue-100 text-blue-700';
        if (t === 'Elementalist') return 'bg-amber-100 text-amber-700';
        if (t === 'Necromancer') return 'bg-purple-100 text-purple-700';
        return 'bg-neutral-200 text-neutral-600';
      };

      const handleExport = () => {
        const jsonString = `data:text/json;charset=utf-8,${encodeURIComponent(JSON.stringify(char, null, 2))}`;
        const a = document.createElement('a');
        a.setAttribute('href', jsonString);
        a.setAttribute('download', `${(char.name || 'Unmade_Traveler').replace(/\s+/g, '_')}_sheet.json`);
        document.body.appendChild(a); a.click(); a.remove();
        notify('Character exported!');
      };

      const handleImport = (e) => {
        const reader = new FileReader();
        reader.readAsText(e.target.files[0], 'UTF-8');
        reader.onload = (ev) => {
          try {
            const parsed = JSON.parse(ev.target.result);
            setChar({ ...char, ...parsed });
            notify('Character imported!');
          } catch { notify('That file doesn\'t look right.'); }
        };
      };

      useEffect(() => {
        if (canvasRef.current) {
          const ctx = canvasRef.current.getContext('2d');
          ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.strokeStyle = theme.accent;
        }
      }, [canvasRef, theme]);

      const startDrawing = ({ nativeEvent }) => {
        const { offsetX, offsetY } = nativeEvent;
        const ctx = canvasRef.current?.getContext('2d');
        if (!ctx) return;
        ctx.beginPath(); ctx.moveTo(offsetX, offsetY);
        setIsDrawing(true); setHasSigil(true);
      };
      const draw = ({ nativeEvent }) => {
        if (!isDrawing) return;
        const { offsetX, offsetY } = nativeEvent;
        const ctx = canvasRef.current?.getContext('2d');
        if (!ctx) return;
        ctx.lineTo(offsetX, offsetY); ctx.stroke();
      };
      const stopDrawing = () => setIsDrawing(false);
      const clearSigil = () => {
        const canvas = canvasRef.current; if (!canvas) return;
        canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
        setHasSigil(false);
      };

                      <div className="flex items-center justify-between border-b border-neutral-200 pb-2">
                        <div>
                          <span className={`text-[11px] uppercase tracking-widest font-serif font-bold ${theme.primary}`}>{label}</span>
                          <span className="text-[9px] text-neutral-400 block mt-0.5 italic">{sublabel}</span>
                        </div>
                        <span className="text-[10px] text-neutral-500 font-bold">{slotCount} Slots</span>
                      </div>
                      <div className="space-y-2">
                        {char[items].map((itemData, index) => {
                          const data = itemData || { item: '', wgt: '' };
                          return (
                            <div key={index} className="flex items-center space-x-3 bg-neutral-50/70 p-2 rounded-xl border border-neutral-200/50">
                              <span className="text-xs font-serif text-neutral-400 font-semibold">{index + 1}.</span>
                              {editMode
                                ? <div className="flex-1 grid grid-cols-12 gap-2">
                                    <input type="text" value={data.item} placeholder="Empty slot"
                                      onChange={e => { const arr=[...char[items]]; arr[index]={...data,item:e.target.value}; setChar({...char,[items]:arr}); }}
                                      className="bg-white p-1 rounded text-xs col-span-9" />
                                    <input type="text" value={data.wgt} placeholder="Enc"
                                      onChange={e => { const arr=[...char[items]]; arr[index]={...data,wgt:e.target.value}; setChar({...char,[items]:arr}); }}
                                      className="bg-white p-1 rounded text-xs text-center col-span-3" />
                                  </div>
                                : <div className="flex justify-between items-center w-full">
                                    <span className={`text-xs font-serif ${data.item ? 'text-neutral-800' : 'text-neutral-300 italic'}`}>{data.item || '---'}</span>
                                    <span className="text-[10px] font-mono text-neutral-400">{data.wgt ? `${data.wgt} enc` : ''}</span>
                                  </div>
                              }
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>

                <BohemianSeparator />

                {/* Wealth + Languages */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 pt-2">
                  <div className="lg:col-span-5 space-y-4">
                    <span className={`text-[10px] uppercase tracking-widest font-serif font-bold ${theme.primary} block`}>Coinage & Curios</span>
                    <div className="grid grid-cols-3 gap-3">
                      {[['gp','Gold Pieces','#9D7D32'],['sp','Silver Pieces','#7A7A7A'],['cp','Copper Pieces','#748774']].map(([key, label, color]) => (
                        <div key={key} className="rounded-2xl border border-neutral-200 p-3 text-center bg-neutral-50">
                          <span className="block text-[9px] uppercase tracking-wider font-semibold font-serif" style={{ color }}>{label}</span>
                          {editMode
                            ? <input type="text" value={char.wealth[key]} onChange={e => setChar({...char, wealth:{...char.wealth,[key]:e.target.value}})} className="w-full text-center text-sm font-bold bg-white mt-1.5 rounded p-0.5 border" />
                            : <span className="block text-base font-bold text-neutral-800 mt-1.5">{char.wealth[key]} {key}</span>
                          }
                        </div>
                      ))}
                    </div>
                    <div>
                      <label className="text-[10px] text-neutral-400 font-serif">Other Valuables / Gems</label>
                      {editMode
                        ? <input type="text" value={char.wealth.items} onChange={e => setChar({...char, wealth:{...char.wealth,items:e.target.value}})} className="w-full text-xs p-2 rounded-xl bg-neutral-50 border border-neutral-200 mt-1" />
                        : <p className="text-xs text-neutral-700 italic mt-1">{char.wealth.items || 'None listed'}</p>
                      }
                    </div>
                  </div>

                  <div className="lg:col-span-7">
                    <div className="p-4 bg-neutral-50/50 rounded-2xl border border-neutral-200 h-full flex flex-col justify-between">
                      <div>
                        <span className={`text-[10px] uppercase tracking-widest font-serif font-bold ${theme.primary} block`}>Known Languages</span>
                        {editMode
                          ? <textarea value={char.languages} onChange={e => setChar({...char, languages: e.target.value})} rows="3"
                              className="w-full text-xs bg-white p-2 rounded-xl border border-neutral-200 mt-1"
                              placeholder="Common Tongue, Ancient High Speech..." />
                          : <p className="text-xs text-neutral-700 leading-relaxed mt-1">{char.languages || 'None declared'}</p>
                        }
                      </div>
                      <p className="text-[9px] text-neutral-400 italic mt-2">Bonus languages from Homeland, high INT, or background study.</p>
                    </div>
                  </div>
                </div>

                <BohemianSeparator />

                {/* Stored items */}
                <div className="space-y-4">
                  <div className="flex justify-between items-center border-b border-neutral-200 pb-2">
                    <div>
                      <span className={`text-[11px] uppercase tracking-widest font-serif font-bold ${theme.primary}`}>Stored Items (Safe House / Vault)</span>
                      <span className="text-[9px] text-neutral-400 block mt-0.5 italic">Not carried into the wild</span>
                    </div>
                    {editMode && <button onClick={addStoredItem} className="text-xs flex items-center space-x-0.5 text-neutral-600 hover:text-neutral-900"><Plus size={14} /><span>Add Item</span></button>}
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {char.storedItems.length === 0
                      ? <div className="col-span-2 text-center py-6 text-xs text-neutral-400 italic">No stored items. Press "Add Item" to track home archives.</div>
                      : char.storedItems.map((st, i) => (
                        <div key={i} className="flex items-center justify-between p-3 bg-neutral-50 rounded-2xl border border-neutral-200 relative">
                          <div className="flex-1 min-w-0 pr-8">
                            {editMode
                              ? <div className="grid grid-cols-2 gap-2">
                                  <input type="text" value={st.item} placeholder="Item" onChange={e => { const u=[...char.storedItems]; u[i]={...u[i],item:e.target.value}; setChar({...char,storedItems:u}); }} className="bg-white p-1 rounded text-xs font-medium" />
                                  <input type="text" value={st.loc} placeholder="Location" onChange={e => { const u=[...char.storedItems]; u[i]={...u[i],loc:e.target.value}; setChar({...char,storedItems:u}); }} className="bg-white p-1 rounded text-xs italic" />
                                </div>
                              : <div className="flex justify-between text-xs">
                                  <span className="font-medium truncate">{st.item}</span>
                                  <span className="text-neutral-500 italic truncate ml-2">@ {st.loc}</span>
                                </div>
                            }
                          </div>
                          {editMode && <button onClick={() => removeStoredItem(i)} className="text-red-400 hover:text-red-600 ml-2"><Trash2 size={13} /></button>}
                        </div>
                      ))
                    }
                  </div>
                </div>

                <BohemianSeparator />

                {/* Mount / Beast */}
                <div className="space-y-4">
                  <span className={`text-[10px] uppercase tracking-widest font-serif font-bold ${theme.primary} block`}>Companions & Beasts of Burden</span>
                  <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-9 gap-3">
                    {[['name','Beast Name'],['ac','Armor Class'],['hp','Hit Points'],['type','Creature Type'],['speed','Speed'],['capacity','Carry Cap.'],['morale','Morale'],['attack','Attack'],['gear','Gear']].map(([key,label]) => (
                      <div key={key} className="p-2 border border-dashed border-neutral-200 rounded-xl text-center bg-white">
                        <span className="block text-[8px] uppercase tracking-wider font-semibold text-neutral-400 font-serif">{label}</span>
                        {editMode
                          ? <input type="text" value={char.mount[key]||''} onChange={e => setChar({...char, mount:{...char.mount,[key]:e.target.value}})} className="w-full text-center text-xs font-bold bg-neutral-50 mt-1 rounded p-0.5" />
                          : <span className="block text-xs font-bold text-neutral-700 mt-1 truncate">{char.mount[key]||'---'}</span>
                        }
                      </div>
                    ))}
                  </div>
                </div>

                {/* Campaign notes */}
                <div className="mt-6 pt-4 border-t border-dashed border-neutral-200 space-y-2">
                  <span className={`text-[10px] uppercase tracking-widest font-serif font-bold ${theme.primary} block`}>Travel Journal & Campaign Records</span>
                  {editMode
                    ? <textarea value={char.notes} onChange={e => setChar({...char, notes: e.target.value})} rows="4"
                        className="w-full text-xs p-3 rounded-2xl bg-neutral-50 border border-neutral-200"
                        placeholder="Notes about artifacts, ancient history, and stars..." />
                    : <div className="p-4 bg-neutral-50 rounded-2xl border border-neutral-200 min-h-[100px]">
                        <p className="text-xs text-neutral-700 leading-relaxed whitespace-pre-wrap font-serif italic">
                          {char.notes ? `"${char.notes}"` : 'Your journal is empty. Adventure awaits...'}
                        </p>
                      </div>
                  }
                </div>

              </section>
            </div>{/* end page 3 */}

          </main>

          {/* Spell Picker Modal */}
          {showSpellPicker && (
            <div className="fixed inset-0 z-50 flex items-start justify-center pt-10 pb-6 px-4 bg-black/40 backdrop-blur-sm"
              onClick={e => { if (e.target === e.currentTarget) setShowSpellPicker(false); }}>
              <div className={`w-full max-w-2xl max-h-[82vh] flex flex-col rounded-3xl ${theme.cardBg} border ${theme.border} shadow-2xl overflow-hidden`}>

                {/* Modal header */}
                <div className={`flex items-center justify-between px-5 py-4 border-b ${theme.border}`}>
                  <div className="flex items-center gap-2">
                    <BookOpen size={18} className={theme.primary} />
                    <h3 className="font-serif text-lg font-bold">Spell Grimoire — Choose Invocations</h3>
                  </div>
                  <button onClick={() => setShowSpellPicker(false)} className="text-neutral-400 hover:text-neutral-800 text-xl leading-none">✕</button>
                </div>

                {/* Filters */}
                <div className={`px-4 py-3 border-b ${theme.border} bg-neutral-50/60 space-y-2.5`}>
                  <input type="text" value={spellFilter.search}
                    onChange={e => setSpellFilter(f => ({...f, search: e.target.value}))}
                    placeholder="Search by spell name..."
                    className="w-full text-sm p-2 rounded-xl border border-neutral-200 focus:outline-none bg-white" />
                  <div className="flex flex-wrap gap-1.5 items-center">
                    {['all','1','2','3','4','5'].map(l => (
                      <button key={l} onClick={() => setSpellFilter(f => ({...f, level: l}))}
                        className={`px-2.5 py-0.5 rounded-full text-[11px] font-semibold transition ${
                          spellFilter.level === l ? `${theme.primary} ${theme.accentBg}` : 'bg-neutral-200 text-neutral-600 hover:bg-neutral-300'
                        }`}>
                        {l === 'all' ? 'All Lvl' : `Lvl ${l}`}
                      </button>
                    ))}
                    <span className="w-px h-4 bg-neutral-300 mx-0.5" />
                    {['all','High Magic','Elementalist','Necromancer'].map(t => (
                      <button key={t} onClick={() => setSpellFilter(f => ({...f, tradition: t}))}
                        className={`px-2.5 py-0.5 rounded-full text-[11px] font-semibold transition ${
                          spellFilter.tradition === t ? `${theme.primary} ${theme.accentBg}` : 'bg-neutral-200 text-neutral-600 hover:bg-neutral-300'
                        }`}>
                        {t === 'all' ? 'All Traditions' : t}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Spell list */}
                <div className="flex-1 overflow-y-auto divide-y divide-neutral-100">
                  {(() => {
                    const filtered = SPELL_LIST.filter(s => {
                      if (spellFilter.level !== 'all' && String(s.lvl) !== spellFilter.level) return false;
                      if (spellFilter.tradition !== 'all' && s.tradition !== spellFilter.tradition) return false;
                      if (spellFilter.search && !s.name.toLowerCase().includes(spellFilter.search.toLowerCase())) return false;
                      return true;
                    });
                    if (filtered.length === 0) return (
                      <div className="p-10 text-center text-xs text-neutral-400 italic">No spells match these filters.</div>
                    );
                    return filtered.map((spell, i) => {
                      const alreadyAdded = char.spells.some(s => s.name === spell.name);
                      return (
                        <div key={i} className={`flex items-start justify-between px-4 py-3 gap-3 transition hover:bg-neutral-50/80 ${alreadyAdded ? 'opacity-55' : ''}`}>
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center flex-wrap gap-1.5 mb-0.5">
                              <span className="font-serif font-semibold text-sm">{spell.name}</span>
                              <span className={`text-[9px] px-1.5 py-0.5 rounded-full font-semibold uppercase tracking-wide ${tradBadge(spell.tradition)}`}>{spell.tradition}</span>
                              <span className="text-[9px] px-1.5 py-0.5 rounded-full font-semibold bg-neutral-200 text-neutral-600 uppercase tracking-wide">Lvl {spell.lvl}</span>
                            </div>
                            <p className="text-[11px] text-neutral-500 leading-relaxed">{spell.desc}</p>
                          </div>
                          <button
                            onClick={() => {
                              if (!alreadyAdded) {
                                setChar(p => ({ ...p, spells: [...p.spells, { lvl: String(spell.lvl), name: spell.name, prep: false, details: spell.desc, tradition: spell.tradition }] }));
                              }
                            }}
                            disabled={alreadyAdded}
                            className={`shrink-0 text-xs px-3 py-1.5 rounded-lg font-semibold transition ${
                              alreadyAdded ? 'bg-neutral-100 text-neutral-400 cursor-not-allowed' : `${theme.accentBg} ${theme.primary} hover:opacity-80`
                            }`}>
                            {alreadyAdded ? 'Added ✓' : '+ Add'}
                          </button>
                        </div>
                      );
                    });
                  })()}
                </div>

                {/* Modal footer */}
                <div className={`px-4 py-3 border-t ${theme.border} flex justify-between items-center bg-neutral-50/60`}>
                  <button onClick={() => {
                    setChar(p => ({ ...p, spells: [...p.spells, { lvl: '1', name: 'Custom Spell', prep: false, details: '', tradition: 'Custom' }] }));
                    setShowSpellPicker(false);
                  }} className="text-xs px-3 py-1.5 rounded-lg bg-neutral-100 text-neutral-600 hover:bg-neutral-200 font-medium flex items-center gap-1">
                    <Plus size={13} /> Add Custom Spell
                  </button>
                  <button onClick={() => setShowSpellPicker(false)}
                    className={`text-xs px-5 py-1.5 rounded-lg ${theme.accentBg} ${theme.primary} font-semibold hover:opacity-80`}>
                    Done
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="mt-12 text-center text-xs text-neutral-400 space-y-1 print:hidden select-none">
            <div className="flex justify-center text-amber-500/60 pb-2">
              <Sun size={24} style={{ animation: 'spin 40s linear infinite' }} />
            </div>
            <p className="font-serif italic text-sm">"By quill, and sword, and herb, our path is woven."</p>
            <p className="text-[10px]">Worlds Without Number is a trademark of Sine Nomine Publishing.</p>
          </footer>

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
