// ===== EVENTS =====

function bindEvents() {
  const app = document.getElementById('app');
  // Remove old listeners by replacing (simpler than tracking)
  const newApp = app.cloneNode(true);
  app.parentNode.replaceChild(newApp, app);
  const a = document.getElementById('app');

  a.addEventListener('click', handleClick);
  a.addEventListener('change', handleChange);
  a.addEventListener('input', handleInput);

  // File import
  const fi = document.getElementById('import-input');
  if (fi) fi.addEventListener('change', e=>{
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = ev => { const id = importChar(ev.target.result); if(id){ openChar(id); } };
    r.readAsText(file);
  });
}

function handleClick(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const ch = getChar();

  switch(action) {
    case 'roster': S.screen='roster'; S.currentId=null; render(); break;
    case 'new-char': startWizard(); break;
    case 'import-char': document.getElementById('import-input')?.click(); break;
    case 'open-char': openChar(btn.dataset.id); break;
    case 'export-char': exportChar(btn.dataset.id); break;
    case 'export-current': if(ch) exportChar(ch.id); break;
    case 'send-to-sheet': sendToSheet(btn.dataset.id); break;
    case 'send-to-sheet-current': if(ch) sendToSheet(ch.id); break;
    case 'delete-char': {
      if(confirm('Delete this character?')) {
        delete S.chars[btn.dataset.id];
        saveAll(); render();
      }
      break;
    }
    case 'tab': S.tab=btn.dataset.tab; render(); break;
    case 'wiz-cls':
      S.w.cls = btn.dataset.cls;
      if(btn.dataset.cls!=='Adventurer') S.w.combo=null;
      render(); break;
    case 'wiz-combo': S.w.combo=btn.dataset.combo; render(); break;
    case 'wiz-gear-pkg': S.w.gearPackage=btn.dataset.pkg; render(); break;
    case 'wiz-spell-toggle': {
      const spName = btn.dataset.spell;
      const w = S.w;
      const maxPick = (w.cls==='Mage' || COMBO_DATA[w.combo||'ExW'].dualMage) ? 4 : 2;
      const arr = w.startingSpells || [];
      const idx = arr.indexOf(spName);
      if (idx >= 0) { arr.splice(idx, 1); }
      else if (arr.length < maxPick) { arr.push(spName); }
      else { alert(`You can only pick ${maxPick} starting spells.`); break; }
      w.startingSpells = arr;
      render(); break;
    }
    case 'wiz-art-pick': {
      const trad = btn.dataset.tradition;
      const artName = btn.dataset.art;
      if (!S.w.startingArts) S.w.startingArts = {};
      S.w.startingArts[trad] = S.w.startingArts[trad] === artName ? '' : artName;
      render(); break;
    }
    case 'wiz-method': {
      S.w.attrMethod=btn.dataset.method;
      // Reset attrs to defaults for the new method
      if(btn.dataset.method==='array') S.w.attrs={str:14,dex:12,con:11,int:10,wis:9,cha:7};
      else if(btn.dataset.method==='roll3'||btn.dataset.method==='roll4') S.w.attrs={str:10,dex:10,con:10,int:10,wis:10,cha:10};
      S.w.set14Attr=null;
      render(); break;
    }
    case 'wiz-roll-attr': { // 4d6 drop
      if(!S.w.attrs) S.w.attrs={str:10,dex:10,con:10,int:10,wis:10,cha:10};
      const {result} = roll4d6Drop();
      S.w.attrs[btn.dataset.attr] = result;
      render(); break;
    }
    case 'wiz-roll-all': { // 4d6 drop all
      S.w.attrs={str:10,dex:10,con:10,int:10,wis:10,cha:10};
      for(const a of ATTR_NAMES){ S.w.attrs[a]=roll4d6Drop().result; }
      render(); break;
    }
    case 'wiz-roll3-attr': { // 3d6
      if(!S.w.attrs) S.w.attrs={str:10,dex:10,con:10,int:10,wis:10,cha:10};
      S.w.attrs[btn.dataset.attr] = d(6)+d(6)+d(6);
      render(); break;
    }
    case 'wiz-roll3-all': { // 3d6 all
      S.w.attrs={str:0,dex:0,con:0,int:0,wis:0,cha:0};
      for(const a of ATTR_NAMES){ S.w.attrs[a]=d(6)+d(6)+d(6); }
      S.w.set14Attr=null;
      render(); break;
    }
    case 'wiz-set14': {
      const a=btn.dataset.attr;
      if(S.w.set14Attr===a){ S.w.set14Attr=null; } // toggle off
      else { S.w.set14Attr=a; }
      render(); break;
    }
    case 'wiz-next': wizNext(); break;
    case 'wiz-back': S.w.step=Math.max(1,(S.w.step||1)-1); render(); break;
    case 'wiz-bg': break; // handled in change
    case 'wiz-bg-opt': {
      S.w.bgOption=btn.dataset.opt;
      S.w.bgPickedSkills=[];
      S.w.bgRolls=[];
      render(); break;
    }
    case 'wiz-bg-free-combat': S.w.bgFreeCombat=btn.dataset.skill; render(); break;
    case 'wiz-bg-pick': {
      const key=btn.dataset.key;
      const picked=S.w.bgPickedSkills||[];
      const idx=picked.indexOf(key);
      if(idx>=0){ picked.splice(idx,1); }
      else if(picked.length<2){ picked.push(key); }
      S.w.bgPickedSkills=picked;
      render(); break;
    }
    case 'wiz-bg-pick-combat': S.w.bgPickCombat=btn.dataset.skill; render(); break;
    case 'wiz-bg-roll-growth':
    case 'wiz-bg-roll-learning': {
      const idx=parseInt(btn.dataset.idx);
      const rolls=S.w.bgRolls||[];
      while(rolls.length<=idx) rolls.push(null);
      const bgData=BACKGROUNDS.find(b=>b.name===S.w.bg);
      if(!bgData) break;
      const isGrowth=action==='wiz-bg-roll-growth';
      const table=isGrowth?bgData.growth:bgData.learning;
      const die=isGrowth?6:8;
      const roll=d(die);
      const entry=table[roll-1];
      rolls[idx]={src:isGrowth?'Growth':'Learning',dieResult:roll,entry,skill:null,attrDist:null};
      S.w.bgRolls=rolls;
      render(); break;
    }
    case 'wiz-bg-roll-combat': {
      const idx=parseInt(btn.dataset.idx);
      if(S.w.bgRolls&&S.w.bgRolls[idx]) S.w.bgRolls[idx].skill=btn.dataset.skill;
      render(); break;
    }
    case 'wiz-bg-roll-attr': { // +1 any stat
      const idx=parseInt(btn.dataset.idx);
      if(S.w.bgRolls&&S.w.bgRolls[idx]) S.w.bgRolls[idx].attrDist={[btn.dataset.attr]:1};
      render(); break;
    }
    case 'wiz-bg-roll-phymen': {
      const idx=parseInt(btn.dataset.idx);
      if(!S.w.bgRolls||!S.w.bgRolls[idx]) break;
      const r=S.w.bgRolls[idx];
      const dist=r.attrDist||{};
      const total=Object.values(dist).reduce((s,v)=>s+v,0);
      if(total<2){ dist[btn.dataset.attr]=(dist[btn.dataset.attr]||0)+1; r.attrDist=dist; }
      render(); break;
    }
    case 'wiz-bg-roll-phymen-reset': {
      const idx=parseInt(btn.dataset.idx);
      if(S.w.bgRolls&&S.w.bgRolls[idx]) S.w.bgRolls[idx].attrDist=null;
      render(); break;
    }
    case 'wiz-finish': wizFinish(); break;

    case 'level-up': if(ch) doLevelUp(ch); break;

    case 'skill-inc': if(ch) { skillChange(ch, btn.dataset.skill, 1); } break;
    case 'skill-dec': if(ch) { skillChange(ch, btn.dataset.skill, -1); } break;

    case 'add-focus-open': toggleFocusPicker(); break;
    case 'focus-remove': if(ch){
      ch.foci.splice(parseInt(btn.dataset.idx),1);
      saveAll(); render(); break;
    }
    case 'focus-upgrade': if(ch){
      ch.foci[parseInt(btn.dataset.idx)].lvl=2;
      saveAll(); render(); break;
    }

    case 'spell-slot-use': if(ch&&ch.spells.slotsUsed<(getSpellSlots(ch)?.cast||0)){
      ch.spells.slotsUsed++; saveAll(); render(); break;
    }
    case 'spell-slots-reset': if(ch){ ch.spells.slotsUsed=0; saveAll(); render(); break; }
    case 'spell-add': if(ch){
      const inp=document.getElementById('new-spell-name');
      const name=(inp?.value||'').trim();
      if(name){ ch.spells.known.push(name); saveAll(); render(); }
      break;
    }
    case 'spell-from-book': if(ch){
      const name=btn.dataset.name;
      if(!ch.spells.known.includes(name)){
        ch.spells.known.push(name);
        const sp=SPELL_LIST.find(s=>s.name===name);
        if(sp){
          if(!ch.spells.details) ch.spells.details={};
          ch.spells.details[name]={desc:sp.desc,tradition:sp.tradition,lvl:sp.lvl};
        }
        saveAll(); render();
      }
      break;
    }
    case 'spell-lib-level': {
      _spellFilter.level=btn.dataset.level;
      refreshSpellLib();
      document.querySelectorAll('[data-action="spell-lib-level"]').forEach(b=>{
        b.className='btn-sm'+(_spellFilter.level===b.dataset.level?' btn-primary':'');
      });
      break;
    }
    case 'spell-remove': if(ch){
      const idx=parseInt(btn.dataset.idx);
      const sp=ch.spells.known[idx];
      ch.spells.known.splice(idx,1);
      ch.spells.prepared=ch.spells.prepared.filter(s=>s!==sp);
      saveAll(); render(); break;
    }

    case 'art-remove': if(ch){
      const artName=btn.dataset.name;
      ch.arts=(ch.arts||[]).filter(a=>a.name!==artName);
      saveAll(); render(); break;
    }

    case 'art-add-open': if(ch){
      const trad=btn.dataset.tradition;
      if(!ARTS[trad]){ alert('No arts data for this tradition.'); break; }
      const known=(ch.arts||[]).map(a=>a.name);
      const opts=ARTS[trad].filter(a=>!known.includes(a.name));
      if(!opts.length){ alert('All arts for this tradition are already known.'); break; }
      const list=opts.map((a,i)=>`${i+1}. ${a.name}`).join('\n');
      const pick=prompt(`Add art from ${trad} — enter number:\n\n${list}`);
      const idx=parseInt(pick)-1;
      if(idx>=0&&idx<opts.length){
        if(!ch.arts) ch.arts=[];
        ch.arts.push({name:opts[idx].name, tradition:trad});
        saveAll(); render();
      }
      break;
    }

    case 'gear-load-pkg': if(ch){
      const pkgName=document.getElementById('gear-pkg-select')?.value;
      if(!pkgName){ alert('Choose a package first.'); break; }
      const pkg=GEAR_PACKAGES.find(p=>p.name===pkgName);
      if(pkg){ for(const item of pkg.items) ch.gear.push({id:genId(),name:item.name,enc:item.enc,readied:item.readied}); }
      saveAll(); render(); break;
    }
    case 'gear-add': if(ch){
      const name=(document.getElementById('new-gear-name')?.value||'').trim();
      const enc=parseFloat(document.getElementById('new-gear-enc')?.value)||1;
      const slot=document.getElementById('new-gear-slot')?.value||'readied';
      if(name){
        ch.gear.push({id:genId(),name,enc,readied:slot==='readied'});
        saveAll(); render();
      }
      break;
    }
    case 'gear-remove': if(ch){
      ch.gear.splice(parseInt(btn.dataset.idx),1);
      saveAll(); render(); break;
    }
    case 'gear-stow': if(ch){ ch.gear[parseInt(btn.dataset.idx)].readied=false; saveAll(); render(); break; }
    case 'gear-ready': if(ch){ ch.gear[parseInt(btn.dataset.idx)].readied=true; saveAll(); render(); break; }
  }
}

function handleChange(e) {
  const el = e.target;
  const action = el.dataset.action;
  const ch = getChar();

  if (action === 'field-update') {
    updateField(ch, el.dataset.field, el.value);
  } else if (action === 'wiz-method') {
    S.w.attrMethod = el.value; render();
  } else if (action === 'wiz-tradition') {
    S.w.tradition = el.value;
    S.w.startingSpells = [];
    S.w.startingArts = {};
    render();
  } else if (action === 'wiz-tradition2') {
    S.w.tradition2 = el.value;
    S.w.startingSpells = [];
    S.w.startingArts = {};
    render();
  } else if (action === 'wiz-bg') {
    S.w.bg = el.value;
    S.w.bgOption = 'quick';
    S.w.bgPickedSkills = [];
    S.w.bgRolls = [];
    S.w.bgFreeCombat = null;
    S.w.bgPickCombat = null;
    render();
  } else if (action === 'wiz-personal-skill') {
    S.w.personalSkill = el.value;
    render();
  } else if (action === 'wiz-bg-roll-skill') {
    const idx=parseInt(el.dataset.idx);
    if(S.w.bgRolls&&S.w.bgRolls[idx]) S.w.bgRolls[idx].skill=el.value;
  } else if (action === 'wiz-array') {
    if(!S.w.attrs) S.w.attrs={str:14,dex:12,con:11,int:10,wis:9,cha:7};
    S.w.attrs[el.dataset.attr] = parseInt(el.value);
    // Update mod display
    const cell = el.closest('.array-slot');
    if(cell) cell.querySelector('.attr-mod-display').textContent = fmtMod(attrMod(parseInt(el.value)));
  } else if (action === 'spell-prep') {
    if(!ch) return;
    const idx = parseInt(el.dataset.idx);
    const sp = ch.spells.known[idx];
    const slots = getSpellSlots(ch);
    if(el.checked) {
      if(ch.spells.prepared.length < (slots?.prepare||0)) ch.spells.prepared.push(sp);
      else { el.checked=false; return; }
    } else {
      ch.spells.prepared = ch.spells.prepared.filter(s=>s!==sp);
    }
    saveAll();
  }
}

function handleInput(e) {
  const el = e.target;
  const action = el.dataset.action;
  const ch = getChar();

  if (action === 'field-update') {
    updateField(ch, el.dataset.field, el.value);
  } else if (action === 'notes-update') {
    if(ch){ ch.notes=el.value; saveAll(); }
  } else if (action === 'wiz-roll-input') {
    if(!S.w.attrs) S.w.attrs={str:10,dex:10,con:10,int:10,wis:10,cha:10};
    const val = Math.max(3,Math.min(18,parseInt(el.value)||10));
    S.w.attrs[el.dataset.attr]=val;
    // Update mod display
    const cell=el.closest('.attr-cell');
    if(cell) cell.querySelector('.attr-mod-display').textContent=fmtMod(attrMod(val));
  } else if (action === 'gear-name') {
    if(ch){ ch.gear[parseInt(el.dataset.idx)].name=el.value; saveAll(); }
  } else if (action === 'gear-enc') {
    if(ch){ ch.gear[parseInt(el.dataset.idx)].enc=parseFloat(el.value)||0; saveAll(); }
  }
}

function updateField(ch, field, rawVal) {
  if (!ch) return;
  const parts = field.split('.');
  let target = ch;
  for (let i=0; i<parts.length-1; i++) target = target[parts[i]];
  const key = parts[parts.length-1];
  const oldType = typeof target[key];
  let val = rawVal;
  if (oldType === 'number') {
    val = parseFloat(rawVal);
    if (isNaN(val)) return;
    // Clamp attribute scores
    if (parts[0]==='attrs') val = Math.max(3, Math.min(18, val));
    if (field==='hpCurrent') val = Math.max(0, Math.min(ch.hpMax, val));
    if (field==='hpMax') val = Math.max(1, val);
    if (field==='strain') val = Math.max(0, Math.min(ch.attrs.con, val));
    val = Number.isInteger(target[key]) ? Math.round(val) : val;
  }
  target[key] = val;
  saveAll();
  // Partial re-render for header HP bar
  if (field==='hpCurrent'||field==='hpMax') {
    const bar = document.querySelector('.hp-bar-fill');
    const txt = document.querySelector('.hp-bar-text');
    if(bar&&txt){
      const pct=Math.max(0,Math.min(1,ch.hpCurrent/ch.hpMax));
      bar.style.width=(pct*100).toFixed(1)+'%';
      bar.style.background=getHpColor(ch);
      txt.textContent=ch.hpCurrent+' / '+ch.hpMax;
    }
  }
}

function skillChange(ch, skillName, delta) {
  const cur = ch.skills[skillName]??-1;
  const next = cur+delta;
  if (next < -1 || next > 4) return;
  if (next > cur && ch.level < SKILL_MIN_LEVELS[next]) {
    alert(`Need character level ${SKILL_MIN_LEVELS[next]} for skill rank ${next}.`); return;
  }
  if (next < 0) delete ch.skills[skillName];
  else ch.skills[skillName] = next;
  saveAll(); render();
}

function toggleFocusPicker() {
  const area = document.getElementById('focus-picker-area');
  if (!area) return;
  if (!area.classList.contains('hidden')) { area.classList.add('hidden'); return; }
  area.classList.remove('hidden');
  area.innerHTML = renderFocusPicker();
  area.querySelector('#focus-search')?.addEventListener('input', e=>{
    const q=e.target.value.toLowerCase();
    area.querySelectorAll('.focus-list-item').forEach(el=>{
      el.style.display=el.dataset.name.toLowerCase().includes(q)?'':'none';
    });
  });
  area.querySelectorAll('.focus-list-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const name=el.dataset.name;
      const lvl=parseInt(el.dataset.lvl||1);
      const ch=getChar();
      if(!ch) return;
      const existing=ch.foci.find(f=>f.name===name);
      if(existing){ existing.lvl=Math.min(2,existing.lvl+1); }
      else { ch.foci.push({name,lvl:1}); }
      saveAll(); render();
    });
  });
}

function renderFocusPicker() {
  return `<div class="focus-picker">
    <div class="section-title">Add Focus</div>
    <div class="focus-search"><input type="text" id="focus-search" placeholder="Search foci…"></div>
    <div class="focus-list">
      ${FOCI.map(f=>`<div class="focus-list-item" data-name="${esc(f.name)}" data-lvl="1">
        <strong>${esc(f.name)}</strong>${f.combat?` <span class="badge">Combat</span>`:''}${f.origin?` <span class="badge" style="background:#5a7a5a;color:#fff">Origin</span>`:''}
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${f.l1}</div>
      </div>`).join('')}
    </div>
  </div>`;
}

// ===== WIZARD LOGIC =====

function startWizard() {
  S.screen='wizard';
  S.w = {
    step:1, cls:'Expert', combo:'ExW',
    attrMethod:'roll3',
    attrs:{str:10,dex:10,con:10,int:10,wis:10,cha:10},
    set14Attr:null,
    name:'', goal:'', bg:'',
    bgOption:'quick', bgPickedSkills:[], bgRolls:[],
    bgFreeCombat:null, bgPickCombat:null,
    personalSkill:'',
    tradition:'', tradition2:'',
    focus1:'', focus2:'', focus3:'',
    gearPackage:'',
    startingSpells:[],
    startingArts:{},
  };
  render();
}

function wizNext() {
  const w = S.w;
  const step = w.step||1;
  // Read current step inputs
  if (step===1) {
    w.name = document.getElementById('wiz-name')?.value?.trim()||'Unnamed';
    w.goal = document.getElementById('wiz-goal')?.value?.trim()||'';
    const trad = document.getElementById('wiz-tradition');
    if(trad) w.tradition = trad.value.trim();
    const trad2 = document.getElementById('wiz-tradition2');
    if(trad2) w.tradition2 = trad2.value.trim();
    if (!w.cls) { alert('Pick a class.'); return; }
    if (w.cls==='Adventurer'&&!w.combo) w.combo='ExW';
  }
  if (step===2) {
    // attrs already live-updated
  }
  if (step===3) {
    if(!w.bg) { alert('Pick a background.'); return; }
    const bgData = BACKGROUNDS.find(b=>b.name===w.bg);
    if(bgData?.freeCombat && !w.bgFreeCombat) { alert('Pick a free combat skill (Stab/Shoot/Punch).'); return; }
    if(w.bgOption==='quick' && bgData?.quickSkills?.includes('__combat__') && !w.bgFreeCombat) { alert('Choose which combat skill (Stab/Shoot/Punch).'); return; }
    if(w.bgOption==='pick' && (w.bgPickedSkills||[]).length<2) { alert('Pick 2 skills from the Learning table.'); return; }
    if(w.bgOption==='pick' && (w.bgPickedSkills||[]).includes('__combat__') && !w.bgPickCombat) { alert('Choose which combat skill (Stab/Shoot/Punch).'); return; }
    if(!w.personalSkill) { alert('Pick a personal skill (Step 9 — any skill of your choice).'); return; }
  }
  if (step===4) {
    if (!w.gearPackage) { alert('Choose a starting equipment package (or Roll for Silver).'); return; }
    // Non-spellcasters finish here instead of going to spell step
    const isSpellChar = w.cls==='Mage' || (w.cls==='Adventurer' && COMBO_DATA[w.combo||'ExW'].hasMage);
    if (!isSpellChar) { wizFinish(); return; }
  }
  w.step = step+1;
  render();
}

// Apply a skill to a character — starts at 0, advances to 1 if already 0
function applySkillGain(ch, skillName) {
  if (!skillName) return;
  const cur = ch.skills[skillName]??-1;
  ch.skills[skillName] = Math.min(1, cur + 1);
}

function wizFinish() {
  const w = S.w;
  w.focus1 = document.getElementById('wiz-focus1')?.value?.trim()||'';
  w.focus2 = document.getElementById('wiz-focus2')?.value?.trim()||'';
  w.focus3 = document.getElementById('wiz-focus3')?.value?.trim()||'';

  if (!w.gearPackage) {
    alert('Choose a starting equipment package (or Roll for Silver).');
    return;
  }

  // Validate arts and spell picks for mage-type characters
  const isMage = w.cls==='Mage' || (w.cls==='Adventurer' && COMBO_DATA[w.combo||'ExW'].hasMage);
  if (isMage) {
    const t1 = w.tradition||'', t2 = w.tradition2||'';
    const traditions = [t1,...(COMBO_DATA[w.combo||'ExW']?.dualMage&&t2&&t2!==t1?[t2]:[])].filter(Boolean);
    // Validate arts picks
    for (const t of traditions) {
      if (!ARTS[t]) continue;
      const opts = ARTS[t].filter(a=>!a.mandatory);
      if (opts.length > 0 && !(w.startingArts||{})[t]) {
        alert(`Pick a starting art for ${t} (Step 5).`);
        return;
      }
    }
    // Validate spell picks for arcane traditions
    const hasSpellTrad = traditions.some(t => SPELL_TRADITIONS.has(t));
    if (hasSpellTrad) {
      const spellCount = (w.cls==='Mage' || COMBO_DATA[w.combo||'ExW']?.dualMage) ? 4 : 2;
      if ((w.startingSpells||[]).length < spellCount) {
        alert(`Choose ${spellCount} starting spell${spellCount>1?'s':''} (Step 5).`);
        return;
      }
    }
  }

  const id = genId();
  const ch = newChar(id);
  ch.name = w.name||'Unnamed';
  ch.goal = w.goal||'';
  ch.cls  = w.cls;
  ch.combo = w.combo||null;
  ch.tradition = w.tradition||'';
  ch.tradition2 = w.tradition2||'';
  ch.bg = w.bg||'';

  // Build attrs: start from rolled/array values, then apply "set to 14" for 3d6
  ch.attrs = {...(w.attrs||{str:10,dex:10,con:10,int:10,wis:10,cha:10})};
  if (w.attrMethod==='roll3' && w.set14Attr) {
    ch.attrs[w.set14Attr] = 14;
  }

  const bgData = BACKGROUNDS.find(b=>b.name===w.bg);

  // Apply free skill from background
  if (bgData) {
    if (bgData.freeCombat) {
      applySkillGain(ch, w.bgFreeCombat||'Stab');
    } else if (bgData.freeSkill) {
      applySkillGain(ch, bgData.freeSkill);
    }
  }

  // Apply additional skills based on chosen option
  if (bgData) {
    if (w.bgOption==='quick') {
      for (const sk of bgData.quickSkills) {
        if (sk==='__combat__') applySkillGain(ch, w.bgFreeCombat||'Stab');
        else applySkillGain(ch, sk);
      }
    } else if (w.bgOption==='pick') {
      for (const key of (w.bgPickedSkills||[])) {
        if (key==='__combat__') applySkillGain(ch, w.bgPickCombat||'Stab');
        else applySkillGain(ch, key);
      }
    } else { // roll
      for (const r of (w.bgRolls||[])) {
        if (!r) continue;
        if (r.entry.type==='skill') applySkillGain(ch, r.entry.skill);
        else if ((r.entry.type==='anySkill'||r.entry.type==='anyCombat') && r.skill) applySkillGain(ch, r.skill);
        else if (r.entry.type==='anyStat'&&r.attrDist) {
          for (const [a,v] of Object.entries(r.attrDist)) ch.attrs[a]=Math.min(18,(ch.attrs[a]||10)+v);
        } else if ((r.entry.type==='physical'||r.entry.type==='mental')&&r.attrDist) {
          for (const [a,v] of Object.entries(r.attrDist)) ch.attrs[a]=Math.min(18,(ch.attrs[a]||10)+v);
        }
      }
    }
  }

  // Apply personal skill pick (Step 9)
  if (w.personalSkill) applySkillGain(ch, w.personalSkill);

  // Apply starting arts (Step 11) — mandatory arts + one optional pick per tradition
  if (!ch.arts) ch.arts = [];
  const t1 = w.tradition||'', t2 = w.tradition2||'';
  const traditions = [t1,...(COMBO_DATA[w.combo||'ExW']?.dualMage&&t2&&t2!==t1?[t2]:[])].filter(Boolean);
  for (const trad of traditions) {
    if (!ARTS[trad]) continue;
    for (const art of ARTS[trad].filter(a=>a.mandatory)) {
      if (!ch.arts.find(a=>a.name===art.name)) ch.arts.push({name:art.name, tradition:trad});
    }
    const pick = (w.startingArts||{})[trad];
    if (pick && !ch.arts.find(a=>a.name===pick)) ch.arts.push({name:pick, tradition:trad});
  }

  // Apply starting spells (Step 11)
  for (const spellName of (w.startingSpells || [])) {
    if (!ch.spells.known.includes(spellName)) ch.spells.known.push(spellName);
    const book = SPELL_LIST.find(s => s.name === spellName);
    if (book) {
      if (!ch.spells.details) ch.spells.details = {};
      ch.spells.details[spellName] = {desc: book.desc, tradition: book.tradition, lvl: book.lvl};
    }
  }

  // Add foci
  if (w.focus1) ch.foci.push({name:w.focus1, lvl:1});
  if (w.focus2) ch.foci.push({name:w.focus2, lvl:1});
  if (w.focus3) ch.foci.push({name:w.focus3, lvl:1});

  // Apply starting gear
  if (w.gearPackage === '__silver__') {
    const sp = (Math.floor(Math.random()*6)+1 + Math.floor(Math.random()*6)+1 + Math.floor(Math.random()*6)+1) * 10;
    ch.gear.push({id:genId(), name:`Starting silver (${sp} sp)`, enc:0, readied:false});
  } else {
    const pkg = GEAR_PACKAGES.find(p=>p.name===w.gearPackage);
    if (pkg) {
      for (const item of pkg.items) {
        ch.gear.push({id:genId(), name:item.name, enc:item.enc, readied:item.readied});
      }
    }
  }

  // Roll HP via dice modal
  const {sides, per} = getHdInfo(ch);
  const conMod = attrMod(ch.attrs.con);
  const bonus = per + conMod;
  showDiceModal({
    title: `Roll Starting HP`,
    sides, count:1, bonus,
    formula: `1d${sides}${bonus>=0?'+':''}${bonus} (min 1)`,
    onAccept: hp => {
      ch.hpMax = Math.max(1, hp);
      ch.hpCurrent = ch.hpMax;
      S.chars[id] = ch;
      saveAll();
      openChar(id);
    },
    onCancel: () => {
      ch.hpMax = Math.max(1, sides+bonus);
      ch.hpCurrent = ch.hpMax;
      S.chars[id] = ch;
      saveAll();
      openChar(id);
    }
  });
}

function openChar(id) {
  S.currentId = id;
  S.screen = 'sheet';
  S.tab = 'overview';
  render();
}

// ===== LEVEL UP =====

function doLevelUp(ch) {
  if (ch.level >= 10) { alert('Already at maximum level (10).'); return; }
  if (!confirm(`Level up ${ch.name} from level ${ch.level} to ${ch.level+1}?`)) return;

  const newLevel = ch.level + 1;
  ch.level = newLevel;

  // Recompute derived stats — already dynamic, no store needed

  // Check if a focus is earned at this level (levels 2,5,7,10)
  const focusLevels = new Set([2,5,7,10]);
  const earnsFocus = focusLevels.has(newLevel);

  // Roll HP
  const {sides, per} = getHdInfo(ch);
  const conMod = attrMod(ch.attrs.con);
  const bonus = per + conMod;
  showDiceModal({
    title: `Level ${newLevel} HP Roll`,
    sides, count:1, bonus,
    formula: `1d${sides}${bonus>=0?'+':''}${bonus} (min 1)`,
    onAccept: hp => {
      const gained = Math.max(1, hp);
      ch.hpMax += gained;
      ch.hpCurrent = Math.min(ch.hpCurrent + gained, ch.hpMax);
      saveAll();
      if (earnsFocus) {
        alert(`Level ${newLevel}: You earn a new Focus pick! Add it via the Combat tab.`);
      }
      render();
    }
  });
}

// ===== UTILITY =====

function esc(s) {
  if (s===undefined||s===null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ===== INIT =====

loadAll();
S.screen = Object.keys(S.chars).length ? 'roster' : 'roster';
render();
</script>
</body>
